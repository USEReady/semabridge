core:
  intermediate_format: OSI
  repository_path: D:\bolt\semabridge\semabridge_state.db
  local_models_path: D:\bolt\semabridge\models
  backup_retention: 5
database:
  backend: orm
  connection_url_env: SEMABRIDGE_DATABASE_URL
  writer_thread_queue: true
llm:
  enabled: false
  model: gpt-4o-mini
  timeout_seconds: 30
  max_retries: 3
  api_key_env: OPENAI_API_KEY
logging:
  level: DEBUG
  format: text
  dir: ./logs
  redact_secrets: true
  log_file: D:\bolt\semabridge\logs\semabridge.log
concurrency:
  max_concurrent_models: 4
  thread_pool_size: 8
options:
  global_exclude_models: []
config_path: D:\bolt\semabridge\config\config.yaml
fabric:
  workspace_id: d875c0c3-59e9-4d55-a7f0-99595b756718
