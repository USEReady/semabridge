# .github/workflows/golden_gate.yml
# Golden Gate: Automated Snowflake live values quality gate.
#
# Minimum Snowflake Grants Required for SNOWFLAKE_ROLE:
#   GRANT USAGE ON WAREHOUSE "<SNOWFLAKE_WAREHOUSE>" TO ROLE "<SNOWFLAKE_ROLE>";
#   GRANT USAGE ON DATABASE "<SNOWFLAKE_DATABASE>" TO ROLE "<SNOWFLAKE_ROLE>";
#   GRANT CREATE SCHEMA ON DATABASE "<SNOWFLAKE_DATABASE>" TO ROLE "<SNOWFLAKE_ROLE>";
#   GRANT USAGE ON SCHEMA "<SNOWFLAKE_DATABASE>"."<SNOWFLAKE_SCHEMA>" TO ROLE "<SNOWFLAKE_ROLE>";
#   GRANT SELECT ON ALL TABLES IN SCHEMA "<SNOWFLAKE_DATABASE>"."<SNOWFLAKE_SCHEMA>" TO ROLE "<SNOWFLAKE_ROLE>";
#   -- Required within temporary sandbox schemas created during the run:
#   --   * CREATE TABLE (for zero-copy clones)
#   --   * CREATE VIEW (for semantic and enriched views)
#   --   * DROP SCHEMA (for teardown cleanup)
#
# Security Invariants:
#   * SNOWFLAKE_ROLE is strictly required (never falls back to user default or ACCOUNTADMIN).
#   * SNOWFLAKE_WAREHOUSE is strictly required (never falls back to user default).
#   * Key-pair authentication via PEM-encoded private key stored in repository secrets.

name: Golden Gate (Snowflake live values)

on:
  push:
    branches:
      - fabric/batch-4-ontology
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: golden-gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  golden-gate:
    name: "Golden Gate (Snowflake live values)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r requirements.txt

      - name: Validate required Snowflake secrets
        run: |
          missing=()
          if [ -z "${{ secrets.SNOWFLAKE_ACCOUNT }}" ]; then missing+=("SNOWFLAKE_ACCOUNT"); fi
          if [ -z "${{ secrets.SNOWFLAKE_USER }}" ]; then missing+=("SNOWFLAKE_USER"); fi
          if [ -z "${{ secrets.SNOWFLAKE_PRIVATE_KEY }}" ]; then missing+=("SNOWFLAKE_PRIVATE_KEY"); fi
          if [ -z "${{ secrets.SNOWFLAKE_WAREHOUSE }}" ]; then missing+=("SNOWFLAKE_WAREHOUSE"); fi
          if [ -z "${{ secrets.SNOWFLAKE_ROLE }}" ]; then missing+=("SNOWFLAKE_ROLE"); fi
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required Snowflake repository secrets: ${missing[*]}"
            echo "SNOWFLAKE_ROLE and SNOWFLAKE_WAREHOUSE are strictly required. Never fall back to user defaults or ACCOUNTADMIN."
            exit 1
          fi
          role_upper=$(echo "${{ secrets.SNOWFLAKE_ROLE }}" | tr '[:lower:]' '[:upper:]')
          if [ "$role_upper" = "ACCOUNTADMIN" ]; then
            echo "::error::SNOWFLAKE_ROLE must not be ACCOUNTADMIN. Use a dedicated role with minimum required grants."
            exit 1
          fi

      - name: Run Golden Gate
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
          SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}
          SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE || 'SEMABRIDGE' }}
          SNOWFLAKE_SCHEMA: ${{ secrets.SNOWFLAKE_SCHEMA || 'SEMABRIDGE_WORKSPACE' }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
        run: |
          python Scripts/golden_gate.py

      - name: Clean up sandbox clones
        if: always()
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
          SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}
          SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE || 'SEMABRIDGE' }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
        run: |
          python -c "
          import os, snowflake.connector
          from semabridge.connectors.snowflake_connection import get_snowflake_connect_kwargs
          from semabridge.core.settings import SnowflakeConfig
          
          account = os.environ.get('SNOWFLAKE_ACCOUNT')
          user = os.environ.get('SNOWFLAKE_USER')
          pk = os.environ.get('SNOWFLAKE_PRIVATE_KEY')
          wh = os.environ.get('SNOWFLAKE_WAREHOUSE')
          role = os.environ.get('SNOWFLAKE_ROLE')
          if account and user and pk and wh and role:
              try:
                  cfg = SnowflakeConfig(
                      account=account, user=user, database=os.environ.get('SNOWFLAKE_DATABASE', 'SEMABRIDGE'),
                      warehouse=wh, role=role, auth_type='keypair', private_key=pk,
                      private_key_passphrase=os.environ.get('SNOWFLAKE_PRIVATE_KEY_PASSPHRASE')
                  )
                  conn = snowflake.connector.connect(**get_snowflake_connect_kwargs(cfg))
                  cur = conn.cursor()
                  cur.execute(\"SHOW SCHEMAS LIKE 'SANDBOX_GOLDEN_%'\")
                  for row in cur.fetchall():
                      sname = row[1]
                      cur.execute(f'DROP SCHEMA IF EXISTS \"{sname}\"')
                      print(f'Dropped sandbox schema: {sname}')
                  conn.close()
              except Exception as e:
                  print(f'Cleanup notice: {e}')
          "
