name: Tests

on:
  push:
  pull_request:
  schedule:
    - cron: '0 2 * * *'  # Nightly at 02:00 UTC
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend test suite
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # In-memory SQLite; Tests/conftest.py also forces it and keeps any .env
      # out of the run. Live tests (real Fabric / Snowflake) and wall-clock
      # tests are skipped: SEMABRIDGE_LIVE_TESTS / SEMABRIDGE_SLOW_TESTS unset.
      SEMABRIDGE_DATABASE_URL: "sqlite:///file::memory:?cache=shared&uri=true"
      SEMABRIDGE_DB_BACKEND: orm
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r requirements.txt pytest-asyncio

      - name: Run backend tests
        # Fails the job on any failed test or collection error; pipes output for skip verification.
        run: >
          python -m pytest -q -p no:cacheprovider -o addopts=""
          -o faulthandler_timeout=300 -rs
          Tests 2>&1 | tee pytest-output.log

      - name: Verify test skip reasons
        if: always()
        run: python Scripts/verify_ci_skips.py pytest-output.log

  slow-tests:
    name: Slow (wall-clock timing) test suite
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SEMABRIDGE_DATABASE_URL: "sqlite:///file::memory:?cache=shared&uri=true"
      SEMABRIDGE_DB_BACKEND: orm
      SEMABRIDGE_SLOW_TESTS: "1"
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r requirements.txt pytest-asyncio

      - name: Run slow backend tests
        run: >
          python -m pytest -q -p no:cacheprovider -o addopts=""
          -o faulthandler_timeout=600 -rs
          Tests -m slow 2>&1 | tee pytest-slow-output.log

      - name: Verify slow test skip reasons
        if: always()
        run: python Scripts/verify_ci_skips.py pytest-slow-output.log

  frontend:
    name: Frontend unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        # Exact versions from the committed lockfile.
        run: npm ci

      - name: Run node tests
        run: node --test src/utils/*.test.js

  pbi-desktop-e2e:
    name: Power BI Desktop E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SEMABRIDGE_DATABASE_URL: "sqlite:///file::memory:?cache=shared&uri=true"
      SEMABRIDGE_DB_BACKEND: orm
      pbi_desktop_source: "true"
      PYTHONPATH: ${{ github.workspace }}/src
      AUTH_ENABLED: "false"
      FRONTEND_URL: "http://127.0.0.1:5180"
      BACKEND_URL: "http://127.0.0.1:8002"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r requirements.txt uvicorn

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Node dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Start backend server
        run: |
          python -m uvicorn semabridge.api.main:app --host 127.0.0.1 --port 8002 > backend.log 2>&1 &
          echo $! > backend.pid

      - name: Start frontend dev server
        run: |
          cd frontend
          npm run dev -- --host 127.0.0.1 --port 5180 > ../frontend.log 2>&1 &
          echo $! > ../frontend.pid

      - name: Wait for backend and frontend servers
        run: |
          echo "Waiting for backend on http://127.0.0.1:8002..."
          READY=0
          for i in $(seq 1 45); do
            if curl -s -f http://127.0.0.1:8002/api/health > /dev/null; then
              echo "Backend is ready"
              READY=1
              break
            fi
            sleep 1
          done
          if [ $READY -eq 0 ]; then
            echo "Backend failed to start. Logs:"
            cat backend.log || true
            exit 1
          fi

          echo "Waiting for frontend on http://127.0.0.1:5180..."
          READY_FE=0
          for i in $(seq 1 45); do
            if curl -s -f http://127.0.0.1:5180/projects/new > /dev/null; then
              echo "Frontend is ready"
              READY_FE=1
              break
            fi
            sleep 1
          done
          if [ $READY_FE -eq 0 ]; then
            echo "Frontend failed to start. Logs:"
            cat frontend.log || true
            exit 1
          fi

      - name: Run Power BI Desktop E2E tests
        working-directory: frontend
        run: node --test tests/pbiDesktopE2E.test.js

