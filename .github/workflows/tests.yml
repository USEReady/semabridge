name: Tests

on:
  push:
  pull_request:
  schedule:
    - cron: '0 2 * * *'  # Nightly at 02:00 UTC
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend test suite
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # In-memory SQLite; Tests/conftest.py also forces it and keeps any .env
      # out of the run. Live tests (real Fabric / Snowflake) and wall-clock
      # tests are skipped: SEMABRIDGE_LIVE_TESTS / SEMABRIDGE_SLOW_TESTS unset.
      SEMABRIDGE_DATABASE_URL: "sqlite:///file::memory:?cache=shared&uri=true"
      SEMABRIDGE_DB_BACKEND: orm
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r requirements.txt pytest-asyncio

      - name: Run backend tests
        # Fails the job on any failed test or collection error; pipes output for skip verification.
        run: >
          python -m pytest -q -p no:cacheprovider -o addopts=""
          -o faulthandler_timeout=300 -rs
          Tests 2>&1 | tee pytest-output.log

      - name: Verify test skip reasons
        if: always()
        run: python Scripts/verify_ci_skips.py pytest-output.log

  postgres:
    name: PostgreSQL lane (shared state, job queue, migrations)
    # The production database. SQLite cannot exercise FOR UPDATE SKIP LOCKED,
    # advisory locks or the Alembic chain on PostgreSQL.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: sbtest
          POSTGRES_PASSWORD: sbtest
          POSTGRES_DB: semabridge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sbtest"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SEMABRIDGE_DATABASE_URL: "postgresql+psycopg2://sbtest:sbtest@127.0.0.1:5432/semabridge_test"
      SEMABRIDGE_DB_BACKEND: orm
      SEMABRIDGE_DISABLE_DOTENV: "1"
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r requirements.txt pytest-asyncio

      - name: Migrations apply cleanly and are idempotent
        run: python Scripts/check_migrations.py

      - name: Run PostgreSQL-sensitive tests
        run: >
          python -m pytest -q -p no:cacheprovider -o addopts="" -rs
          Tests/test_shared_state_store.py Tests/test_job_queue.py Tests/test_run_cancel.py
          Tests/test_plan_once_readiness.py Tests/test_multi_process_state.py
          Tests/test_strict_startup.py Tests/test_azure_platform.py

    name: Slow (wall-clock timing) test suite
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SEMABRIDGE_DATABASE_URL: "sqlite:///file::memory:?cache=shared&uri=true"
      SEMABRIDGE_DB_BACKEND: orm
      SEMABRIDGE_SLOW_TESTS: "1"
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r requirements.txt pytest-asyncio

      - name: Run slow backend tests
        run: >
          python -m pytest -q -p no:cacheprovider -o addopts=""
          -o faulthandler_timeout=600 -rs
          Tests -m slow 2>&1 | tee pytest-slow-output.log

      - name: Verify slow test skip reasons
        if: always()
        run: python Scripts/verify_ci_skips.py pytest-slow-output.log

  frontend:
    name: Frontend unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        # Exact versions from the committed lockfile.
        run: npm ci

      - name: Run node tests
        run: node --test src/utils/*.test.js
