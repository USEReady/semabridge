name: CI Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_extended:
        description: Run extended integration checks
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    outputs:
      backend_changed: ${{ steps.filter.outputs.backend }}
      frontend_changed: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changed areas
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'src/**'
              - 'Tests/**'
              - 'pyproject.toml'
              - 'requirements.txt'
              - 'pytest.ini'
            frontend:
              - 'frontend/**'

  backend_quality:
    name: Backend Quality Gates
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.backend_changed == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Ruff lint
        run: ruff check src/semabridge

      - name: Unit and core tests
        run: |
          pytest Tests/test_*.py Tests/Core -q --maxfail=1

      - name: Upload backend diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-failure-context
          path: |
            .pytest_cache
            output/debug
          if-no-files-found: ignore

  frontend_quality:
    name: Frontend Quality Gates
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.frontend_changed == 'true' || github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend lint
        run: npm run lint

      - name: Frontend build
        run: npm run build

      - name: Upload frontend diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-failure-context
          path: |
            frontend/dist
            frontend/eslint.config.js
          if-no-files-found: ignore

  security_checks:
    name: Security Checks
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.backend_changed == 'true' || needs.preflight.outputs.frontend_changed == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      - name: Python dependency audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          pip-audit --ignore-vuln GHSA-w596-4wvx-j9j6

      - name: Setup Node for audit
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Frontend npm audit (high and above)
        working-directory: frontend
        run: npm audit --audit-level=high

  extended_integration:
    name: Extended Integration Checks
    runs-on: ubuntu-latest
    needs: [backend_quality, frontend_quality]
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_extended == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Integration sanity suite
        run: |
          pytest Tests/Integration/test_backend_discovery.py -q

  ci_summary:
    name: CI Summary
    runs-on: ubuntu-latest
    if: always()
    needs:
      - preflight
      - backend_quality
      - frontend_quality
      - security_checks
      - extended_integration
    steps:
      - name: Publish workflow summary
        run: |
          echo "## CI Result" >> $GITHUB_STEP_SUMMARY
          echo "- Backend changed: ${{ needs.preflight.outputs.backend_changed }}" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend changed: ${{ needs.preflight.outputs.frontend_changed }}" >> $GITHUB_STEP_SUMMARY
          echo "- Backend quality: ${{ needs.backend_quality.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend quality: ${{ needs.frontend_quality.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Security checks: ${{ needs.security_checks.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Extended integration: ${{ needs.extended_integration.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Failure Recovery" >> $GITHUB_STEP_SUMMARY
          echo "1. Download failure artifacts from failed jobs." >> $GITHUB_STEP_SUMMARY
          echo "2. Reproduce locally with the same commands shown in logs." >> $GITHUB_STEP_SUMMARY
          echo "3. Push a fix commit; this workflow auto-runs and cancels older runs." >> $GITHUB_STEP_SUMMARY
          echo "4. If main breaks, revert the offending commit immediately." >> $GITHUB_STEP_SUMMARY
