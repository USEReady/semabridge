name: SemaBridge Automated Pre-Deploy Quality Gate

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

concurrency:
  group: pre-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: "Gate 1: Secrets & Security Scan"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for committed sensitive credential files
        run: |
          echo "Scanning git tree for .env, .pem, or credential files..."
          DANGEROUS=$(git ls-files | grep -E '(\.env$|\.pem$|\.key$|credentials\.json)' || true)
          if [ -n "$DANGEROUS" ]; then
            echo "❌ ERROR: Found tracked secret files in repository:"
            echo "$DANGEROUS"
            exit 1
          fi
          echo "✓ Clean repository: No secret files committed."

  backend-quality-gate:
    name: "Gate 2-4: Backend Compilation & Tests"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r requirements.txt pytest-asyncio

      - name: Validate Python syntax & bytecode compilation
        run: |
          python -m compileall -q src/
          echo "✓ All Python files in src/ successfully compiled."

      - name: Run Backend Regression Test Suite
        run: |
          pytest Tests/test_scheduler_and_sync_modes.py Tests/test_job_runs_listing.py Tests/test_blast_radius_and_linter.py Tests/test_golden_verifier.py Tests/test_nl_gold_benchmark.py -v

      - name: Run Governance Quality Gate
        run: |
          python Tests/governance_tests/g09_cicd_gate.py --gate-only --direct --ontologies-dir Config/ontologies --changed --base-ref "${{ github.event.pull_request.base.ref || 'origin/main' }}" --max-errors 0 --steward-level warning --check-certifications

  frontend-quality-gate:
    name: "Gate 5: Frontend Production Bundle Build"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Compile Vite Production Build
        working-directory: frontend
        run: npm run build
