name: Apply Database Migrations

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment (staging or production)'
        required: true
        type: choice
        options:
          - staging
          - production

env:
  PYTHON_VERSION: '3.11'

jobs:
  migrate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [staging, production]
    environment: ${{ matrix.environment }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install alembic sqlalchemy psycopg2-binary python-dotenv

      - name: Get environment variables
        run: |
          echo "DATABASE_URL=${{ secrets[format('{0}_DATABASE_URL', matrix.environment)] }}" >> $GITHUB_ENV

      - name: Validate database connection
        run: |
          python -c "
          import os
          from sqlalchemy import create_engine, text
          try:
              engine = create_engine(os.getenv('DATABASE_URL'))
              with engine.connect() as conn:
                  result = conn.execute(text('SELECT 1'))
              print('✓ Database connection successful')
          except Exception as e:
              print(f'✗ Database connection failed: {e}')
              exit(1)
          "

      - name: Run Alembic migrations
        run: |
          alembic upgrade head
        env:
          SQLALCHEMY_DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Verify migration success
        run: |
          alembic current
          echo "✓ Migrations applied successfully"

      - name: Notify deployment (optional)
        if: success()
        run: |
          echo "✓ Database migrations completed for ${{ matrix.environment }}"

      - name: Notify failure
        if: failure()
        run: |
          echo "✗ Migration failed for ${{ matrix.environment }}"
          exit 1
