name: Semabridge Model Validation Pipeline

on:
  push:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      config_path:
        description: 'Path to project YAML config file containing models'
        required: false
        default: 'Config/projects/proj-model10_snowflaketofabric.yaml'

jobs:
  validate-models:
    name: Run Sequential Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dotenv pyyaml

      - name: Validate Models
        run: python Scripts/ValidateAllModels.py --config "${{ github.event.inputs.config_path || 'Config/projects/proj-model10_snowflaketofabric.yaml' }}"
        env:
          SEMABRIDGE_API_URL: "http://127.0.0.1:8001"
