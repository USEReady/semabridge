<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SemaBridge — Configuration Workspace</title>
    <meta name="description" content="SemaBridge: A modern configuration workspace for semantic model management in timber construction and BIM." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
      // Emergency recovery for persisted-state loops.
      if (window.location.search.includes('reset=true')) {
        localStorage.clear();
        window.location.href = window.location.origin;
      }

      // Inline theme detection to prevent FOUC (Flash of Unstyled Content)
      (function() {
        const stored = localStorage.getItem('semabridge-theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const theme = stored || (prefersDark ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
