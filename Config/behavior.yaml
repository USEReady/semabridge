snowflake:
  apply_inferred_types: true

features:
  offline_mode: false
  offline_fabric_model_path: output/debug/raw_fabric_model.json

semantic_model:
  # Manual SQL overrides are intentionally unsupported.
  # Metric SQL is generated by the automated translation pipeline.
  sync_all_attributes: true

# ---------------------------------------------------------------------------
# Databricks deployment behavior.
# ---------------------------------------------------------------------------
databricks:
  create_metadata_table: true # OSI-first deploy: skip Semabridge metadata Delta table
  create_measure_views: true # Generate measure views for deployed measures
  model_artifact_mode: "per_model" # "per_dataset" (legacy) | "per_model" (single metadata + single model metric view)
  model_metadata_suffix: "metadata" # Per-model metadata table suffix in per_model mode
  model_metric_view_suffix: "metric_view" # Per-model metric view suffix in per_model mode
  model_fact_root: "" # Optional dataset name to anchor model-level view generation in per_model mode
  multi_fact_split_mode: "off" # "off" (legacy) | "opt_in" | "enforced" (fact constellation split)
  dummy_measure_anchor_confidence_threshold: 0.8 # Minimum confidence to relocate dummy-table measures to fact anchors
  review_required_blocks_deployment: false # If true, unresolved review-required measures block deployment
  strict_cycle_fail_mode: false # If true, relationship cycles fail affected artifact generation
  measure_view_type: "metric_view" # "auto" | "metric_view" | "materialized_view" | "sql_view" | "none"
  measure_view_mode: "combined" # "per_measure" (one view each) or "combined" (single model-level joined view)
  view_prefix: "mv" # Prefix for measure view names
  deterministic_translation_enabled: true # Enforce single-source-of-truth deterministic translation first
  enable_simple_dax_translation: true # Translate simple DAX (SUM, COUNT, etc.) to SQL
  enable_llm_dax_translation: true # Use common LLM fallback for complex DAX after deterministic translation fails
  fail_on_dax_translation_failure: true # Fail sync when a measure cannot be translated instead of silently skipping it
  llm_dax_provider_order: ["openai", "deepseek", "gemini", "groq"] # Try OpenAI first, then DeepSeek/Gemini/Groq fallback
  llm_dax_timeout_seconds: 20 # Per-provider LLM timeout before trying the next provider
  llm_dax_cache_enabled: true # Cache DAX/schema/dialect translations to reduce repeated API calls
  llm_dax_fallback_to_placeholder: true # Never skip solely because all LLM providers failed
  metric_view_only_sum_translation: true # Restrict simple DAX SUM translation to native metric-view generation only
  enable_cross_table_joins: true # Build explicit joins from model relationships when measures span datasets
  enable_metric_view_joins: true # Enable metric view 'joins' property for multi-table snowflake schemas (requires enable_cross_table_joins=true)
  enable_cross_table_sql_fallback: false # Auto-route cross-table models to SQL views when metric-view cannot safely resolve them
  allow_sql_fallback_on_metric_view_failure: false # Allow SQL downgrade when metric-view deploy fails even if measure_view_type='metric_view'
  statement_wait_timeout_seconds: 12 # Reduce per-statement wait before polling for faster sync feedback
  statement_poll_interval_seconds: 1.0 # Poll statement status more frequently to reduce idle wait
  enable_low_confidence_drafts: true # Emit draft placeholders for low-confidence measures instead of dropping them
  emit_metric_views_for_all_datasets: true # Create fallback metric views for dimension-only datasets
  emit_distinct_pk_metric_for_dimension_datasets: true # Also emit COUNT(DISTINCT pk) for dimension-only datasets when key inference is confident
  strict_graph_coverage_validation: false # When true, fail deploy if relationship endpoint coverage is invalid; false logs warnings
  enable_auto_join_key_bridge: true # Auto-create/backfill missing physical relationship key columns during Databricks publish preflight
  enable_destructive_sync_operations: true # Allow DROP VIEW/TABLE before re-creating when an object-type conflict is detected at the target name

  # -------- Semantic Router Configuration (Fact-Centric Artifact Generation) --------
  semantic_router_enabled: false # Force single model-level metric-view generation for all models (disable per-fact semantic-router splitting).
  semantic_router_override_models: [] # List of model names to exclude from semantic router (useful for gradual rollout). Example: [ 'LegacyDatamart', 'OldModel' ]

  # Source table mapping: Fabric dataset name → actual Databricks table
  # If not mapped, falls back to source_catalog.source_schema.dataset_name
  source_table_mapping:
    DEVICE_INVENTORY: "semabridge.public.device_inventory"
    Date: "semabridge.public.dim_date"
    Fact: "semabridge.public.fact"
    SalesFact: "semabridge.public.fact"
    BU: "semabridge.public.bu"
    Calendar: "semabridge.public.calendar"
    Customer: "semabridge.public.customer"
    Scenario: "semabridge.public.scenario"
    Product: "semabridge.public.product"
    Industry: "semabridge.public.industry"
    Executive: "semabridge.public.executive"
    State: "semabridge.public.state"
  # Optional semantic-column to physical-column overrides when warehouse names
  # differ from Fabric-friendly semantic names.
  source_column_mapping:
    Calendar:
      "YearPeriod": "yearperiod"
      "Year": "year"
      "Period": "period"
      "Date": "date"
      "Month": "month"
      "QtrID": "qtrid"
      "Qtr": "qtr"
    Customer:
      "Customer": "customer_key"
      "Name": "name"
      "City": "city"
      "Postal Code": "postal_code"
      "State": "state"
      "Industry ID": "industry_id"
      "Country/Region": "country_region"
    BU:
      "BU Key": "bu_key"
      "BU": "bu_name"
      "BU Name": "bu_name"
    Scenario:
      "Scenario Key": "scenario_key"
      "Scenario": "scenario_name"
      "Scenario Name": "scenario_name"
    Product:
      "Product Key": "product_key"
      "Product": "product_name"
      "Product Name": "product_name"
    Industry:
      "Industry ID": "industry_id"
      "Industry": "industry_name"
      "Industry Name": "industry_name"
    State:
      "State": "State"
      "State Code": "StateCode"
      "Region": "Region"
  # Keep Fact financial columns unmapped here until upstream ingestion lands
  # them physically in semabridge.public.fact.
  #   Fact:
  #     "Revenue": "revenue"
  #     "Material Costs": "material_costs"
  #     "Labor Costs Variable": "labor_costs_variable"
  #     "Taxes": "taxes"
  #     "Rev for Exp Travel": "rev_for_exp_travel"
  #     "Travel Expenses": "travel_expenses"
  #     "Cost Third Party": "cost_third_party"
  #     "Subscription Revenue": "subscription_revenue"
  #     "YearPeriod": "yearperiod"
  source_catalog: "semabridge" # Default catalog for source data tables
  source_schema: "public" # Default schema for source data tables
  on_missing_source: "skip" # "plan" | "skip" | "fail" ; continue sync by projecting NULL placeholders for missing source columns

  # Governance: auto-grant SELECT on deployed metric views
  grant_select_to_groups: []
  # - "data_consumers"
  # - "analytics_team"
  transfer_ownership_to: "" # Group for collaborative metric view editing

# ---------------------------------------------------------------------------
# Discovery behaviour for the Fabric ↔ Snowflake semantic sync feature.
# ---------------------------------------------------------------------------
discovery:
  # Controls what Snowflake objects are surfaced by GET /api/discovery/snowflake.
  # Options:
  #   "semantic_view"  – only SEMANTIC VIEWs (default; recommended for semantic sync)
  #   "table"          – only physical BASE TABLEs (legacy behaviour)
  #   "all"            – semantic views + tables + regular views
  snowflake_object_type: "semantic_view"

  # When true, models/views that have no existing ModelMapping are still
  # included in discovery results (they will show in_sync=false).
  include_unmapped: true

  # Semantic view suffix appended when creating Snowflake semantic views
  # from Fabric models.  Must match the value in semantic_model.view_suffix
  # if that key is set; defaults to "_SEMANTIC".
  semantic_view_suffix: "_SEMANTIC"
