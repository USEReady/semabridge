core:
  intermediate_format: OSI
  repository_path: D:\bolt\semabridge\semabridge.db
  local_models_path: D:\bolt\semabridge\models
  backup_retention: 5
database:
  backend: orm
  connection_url_env: SEMABRIDGE_DATABASE_URL
  writer_thread_queue: true
# NOTE: this block is not currently wired into the live DAX-to-SQL
# translation pipeline (verified: LLMConfigManager/GlobalConfigManager,
# the only readers of `llm.*`, have no callers anywhere else in the
# codebase). Toggling `enabled` here has no effect on Snowflake or
# Databricks Tier-5/LLM DAX fallback. The actual switch for that is
# whether a provider is configured (env var or Settings-page key) in
# semabridge.dax_translation.tier5.config — see Docs or the Settings
# page's "LLM Providers" section.
llm:
  enabled: false
  model: gpt-4o-mini
  timeout_seconds: 30
  max_retries: 3
  api_key_env: OPENAI_API_KEY
logging:
  level: DEBUG
  format: text
  dir: ./logs
  redact_secrets: true
  log_file: D:\bolt\semabridge\semabridge.log
concurrency:
  max_concurrent_models: 4
  thread_pool_size: 8
options:
  global_exclude_models: []
config_path: Config/semabridge.yaml
fabric:
  workspace_id: d6e5bfe7-c544-4474-ac3b-ddce9a02e712
  workspace_name: semabridge
