# DAX function registry for deterministic AST renderer
# type: window | scalar | expr
# template variables: {arg0}, {arg1}, {arg2}, {table_alias}, {date_alias}

TOTALYTD:
  type: window
  template: |
    {arg0} OVER (
        PARTITION BY {date_alias}."YEAR"
        ORDER BY {date_alias}."DATE"
        ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW
    )
TOTALMTD:
  type: window
  template: |
    {arg0} OVER (
        PARTITION BY {date_alias}."YEAR", {date_alias}."MONTH"
        ORDER BY {date_alias}."DATE"
        ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW
    )
TOTALQTD:
  type: window
  template: |
    {arg0} OVER (
        PARTITION BY {date_alias}."YEAR", {date_alias}."QUARTER"
        ORDER BY {date_alias}."DATE"
        ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW
    )
DIVIDE:
  type: scalar
  template: "DIV0({arg0}, {arg1})"
# IF intentionally has no registry entry: it must go through
# dax_ast_parser.py's _render_if, which wraps a numeric-truthiness
# condition (e.g. IF(CALCULATE(...SAMEPERIODLASTYEAR...), ...), a common
# YoY/SPLY guard) in an explicit boolean comparison. A flat template here
# would emit the raw FLOAT-valued condition directly into "CASE WHEN
# {arg0} THEN ...", which Snowflake rejects with "Can not convert
# parameter '...' of type [FLOAT] into expected type [BOOLEAN]" -- taking
# down the whole semantic-view DDL, not just the one metric.
ISBLANK:
  type: expr
  template: "({arg0} IS NULL)"
