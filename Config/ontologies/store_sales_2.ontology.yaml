- name: TotalSales
  logical_name: TOTALSALES
  label: TotalSales
  sql_expression: CASE WHEN (SUM(SALES."SUM_REGULAR_SALES_DOLLARS")) IS NULL AND (SUM(SALES."SUM_MARKDOWN_SALES_DOLLARS"))
    IS NULL THEN NULL ELSE COALESCE((SUM(SALES."SUM_REGULAR_SALES_DOLLARS")), 0) +
    COALESCE((SUM(SALES."SUM_MARKDOWN_SALES_DOLLARS")), 0) END
  dax_expression: '[Regular_Sales_Dollars]+[Markdown_Sales_Dollars]'
  is_hidden: false
  aggregation_type: NONE
