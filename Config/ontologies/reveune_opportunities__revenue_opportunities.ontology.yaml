- name: AVERAGE_OPPORTUNITY_DAYS
  logical_name: AVERAGE_OPPORTUNITY_DAYS
  label: Average Opportunity Days
  description: Calculates the average number of days between the sales date and the
    closed date for each sales record
  sql_expression: AVG(DATEDIFF(DAY, SALES."SALES_DATE", SALES."CLOSED_DATE")::FLOAT)
  dax_expression: "AVERAGEX(\n    Sales,\n    DATEDIFF(Sales[Sales Date], Sales[Closed\
    \ Date], DAY)\n)"
  format_string: Whole Number
  is_hidden: false
  aggregation_type: NONE
  grain: []
  synonyms:
