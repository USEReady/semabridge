metrics:
- name: CASE_COUNT
  label: Case Count
  sql_expression: COUNT(*)
  dax_expression: "\n    COUNTROWS('Cases')"
  aggregation_type: NONE
  grain: []
  synonyms:
  - Case Count
  - CASE_COUNT
  business_rules: []
  domain: Artificial Intelligence Sample
  concept: Cases
  tags: []
  origin: bi
- name: ESCALATIONS
  label: Escalations
  sql_expression: IFF(COALESCE((COUNT(*)), 0) = 0, 0, COUNT(CASE WHEN CASES."IS_ESCALATED"
    = TRUE THEN 1 END) / (COUNT(*)))
  dax_expression: DIVIDE(CALCULATE(COUNTROWS('Cases'),'Cases'[Is Escalated] = TRUE())
    , [CASE_COUNT],0)
  aggregation_type: NONE
  grain: []
  synonyms:
  - Escalations
  - Escalated
  - Escalated Cases
  business_rules: []
  domain: Artificial Intelligence Sample
  concept: Cases
  tags: []
  origin: bi
- name: SLA_COMPLIANCE
  label: SLA Compliance
  sql_expression: IFF(COALESCE((COUNT(*)), 0) = 0, 0, COUNT(CASE WHEN CASES."IS_SLA_VIOLATION"
    = FALSE THEN 1 END) / (COUNT(*)))
  dax_expression: DIVIDE(CALCULATE(COUNTROWS('Cases'),'Cases'[Is SLA Violation] =
    FALSE()) , [CASE_COUNT],0)
  aggregation_type: NONE
  grain: []
  synonyms:
  - SLA Compliance
  - SLA_COMPLIANCE
  business_rules: []
  domain: Artificial Intelligence Sample
  concept: Cases
  tags: []
  origin: bi
- name: CASES_MOMPCT
  label: Cases MoM%
  sql_expression: (CASE WHEN ((COUNT(*))) IS NULL AND ((COUNT(CASE WHEN CASES."IS_SPLY_MONTH"
    THEN 1 END))) IS NULL THEN NULL ELSE (COUNT(*)) - (COUNT(CASE WHEN CASES."IS_SPLY_MONTH"
    THEN 1 END)) END) / NULLIF((COUNT(CASE WHEN CASES."IS_SPLY_MONTH" THEN 1 END)),
    0)
  dax_expression: "\nVAR __PREV_MONTH = CALCULATE([CASE_COUNT], DATEADD('Case Calendar'[Date],\
    \ -1, MONTH))\nRETURN\n\tDIVIDE([CASE_COUNT] - __PREV_MONTH, __PREV_MONTH)"
  aggregation_type: NONE
  grain: []
  synonyms:
  - Cases MoM%
  - Cases Mompct
  - CASES_MOMPCT
  business_rules: []
  domain: Artificial Intelligence Sample
  concept: Cases
  tags: []
  origin: bi
- name: CASES_PCT_BY_PRODUCT
  label: Cases % by Product
  sql_expression: CASES."CASE_COUNT" / NULLIF(SUM(CASES."CASE_COUNT"::FLOAT) OVER
    (PARTITION BY EXCLUDING PRODUCTS."PRODUCT"), 0)
  dax_expression: "\nDIVIDE(\n        [CASE_COUNT],\n        CALCULATE(\n        \
    \    [CASE_COUNT],All('Products')\n        )\n    )"
  aggregation_type: NONE
  grain: []
  synonyms:
  - Cases % by Product
  - Cases Pct By Product
  - CASES_PCT_BY_PRODUCT
  business_rules: []
  domain: Artificial Intelligence Sample
  concept: Cases
  tags: []
  origin: bi
- name: CASES_PCT_BY_SUBJECT
  label: Cases % by Subject
  sql_expression: CASES."CASE_COUNT" / NULLIF(SUM(CASES."CASE_COUNT"::FLOAT) OVER
    (PARTITION BY EXCLUDING CASES."SUBJECT"), 0)
  dax_expression: "\nDIVIDE(\n        [CASE_COUNT],\n        CALCULATE(\n        \
    \    [CASE_COUNT],All('Cases'[Subject])\n        )\n    )"
  aggregation_type: NONE
  grain: []
  synonyms:
  - Cases % by Subject
  - Cases Pct By Subject
  - CASES_PCT_BY_SUBJECT
  business_rules: []
  domain: Artificial Intelligence Sample
  concept: Cases
  tags: []
  origin: bi
- name: CSAT_IMPACT
  label: CSAT Impact
  sql_expression: CASE WHEN (1) IS NULL AND ((((SUM(CASES."CSAT_SUM"::FLOAT) OVER
