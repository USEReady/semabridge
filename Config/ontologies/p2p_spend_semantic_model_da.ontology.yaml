- name: TOTAL_SPEND
  logical_name: TOTAL_SPEND
  label: Total Spend
  description: Base spend measure. Sum of Transaction_USD_Amount. Dependency for all
    derived measures.
  sql_expression: SUM(SPEND_FACT."TRANSACTION_USD_AMOUNT")
  dax_expression: SUM(spend_fact[Transaction_USD_Amount])
  format_string: $#,##0.00
  is_hidden: false
