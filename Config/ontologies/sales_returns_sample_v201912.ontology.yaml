- name: LAST_2_MONTHS_NET_SALES
  logical_name: LAST_2_MONTHS_NET_SALES
  label: Last 2 Months Net Sales
  sql_expression: CASE WHEN (SUM(CASE WHEN SALES.STATUS = 'Sold' THEN SALES."AMOUNT"
    ELSE 0 END)) IS NULL AND (SUM(CASE WHEN ANALYSIS_DAX."IS_PREV_MONTH" THEN CASE
    WHEN SALES.STATUS = 'Sold' THEN SALES."AMOUNT" ELSE 0 END ELSE NULL END)) IS NULL
    THEN NULL ELSE COALESCE((SUM(CASE WHEN SALES.STATUS = 'Sold' THEN SALES."AMOUNT"
    ELSE 0 END)), 0) + COALESCE((SUM(CASE WHEN ANALYSIS_DAX."IS_PREV_MONTH" THEN CASE
    WHEN SALES.STATUS = 'Sold' THEN SALES."AMOUNT" ELSE 0 END ELSE NULL END)), 0)
    END
  dax_expression: '[NET_SALES]+[NET_SALES_PM]'
  aggregation_type: NONE
  grain: []
  synonyms:
  - Last 2 Months Net Sales
  - LAST_2_MONTHS_NET_SALES
  business_rules: []
  domain: Sales & Returns Sample v201912
  concept: Sales
  semantic_view_name: SEMABRIDGE.SALES_AND_RETURNS.SALES__RETURNS_SAMPLE_V201912_SEMANTIC
  tags: []
  origin: bi
- name: NET_SALES_VARIANCE
  logical_name: NET_SALES_VARIANCE
  label: Net Sales Variance
  sql_expression: CASE WHEN (SUM(CASE WHEN SALES.STATUS = 'Sold' THEN SALES."AMOUNT"
    ELSE 0 END)) IS NULL AND (SUM(CASE WHEN ANALYSIS_DAX."IS_PREV_MONTH" THEN CASE
    WHEN SALES.STATUS = 'Sold' THEN SALES."AMOUNT" ELSE 0 END ELSE NULL END)) IS NULL
    THEN NULL ELSE COALESCE((SUM(CASE WHEN SALES.STATUS = 'Sold' THEN SALES."AMOUNT"
    ELSE 0 END)), 0) - COALESCE((SUM(CASE WHEN ANALYSIS_DAX."IS_PREV_MONTH" THEN CASE
    WHEN SALES.STATUS = 'Sold' THEN SALES."AMOUNT" ELSE 0 END ELSE NULL END)), 0)
    END
  dax_expression: '[NET_SALES]-[NET_SALES_PM]'
  aggregation_type: NONE
  grain: []
  synonyms:
  - Net Sales Variance
  - NET_SALES_VARIANCE
  business_rules: []
  domain: Sales & Returns Sample v201912
  concept: Sales
  semantic_view_name: SEMABRIDGE.SALES_AND_RETURNS.SALES__RETURNS_SAMPLE_V201912_SEMANTIC
  tags: []
  origin: bi
- name: NET_SALES_VARIANCE_PCT
  logical_name: NET_SALES_VARIANCE_PCT
  label: Net Sales Variance %
  sql_expression: CASE WHEN (IFF(COALESCE((SUM(CASE WHEN ANALYSIS_DAX."IS_PREV_MONTH"
    THEN CASE WHEN SALES.STATUS = 'Sold' THEN SALES."AMOUNT" ELSE 0 END ELSE NULL
    END)), 0) = 0, 0, (SUM(CASE WHEN SALES.STATUS = 'Sold' THEN SALES."AMOUNT" ELSE
    0 END)) / (SUM(CASE WHEN ANALYSIS_DAX."IS_PREV_MONTH" THEN CASE WHEN SALES.STATUS
    = 'Sold' THEN SALES."AMOUNT" ELSE 0 END ELSE NULL END)))) IS NULL AND (1) IS NULL
    THEN NULL ELSE COALESCE(IFF(COALESCE((SUM(CASE WHEN ANALYSIS_DAX."IS_PREV_MONTH"
    THEN CASE WHEN SALES.STATUS = 'Sold' THEN SALES."AMOUNT" ELSE 0 END ELSE NULL
    END)), 0) = 0, 0, (SUM(CASE WHEN SALES.STATUS = 'Sold' THEN SALES."AMOUNT" ELSE
    0 END)) / (SUM(CASE WHEN ANALYSIS_DAX."IS_PREV_MONTH" THEN CASE WHEN SALES.STATUS
    = 'Sold' THEN SALES."AMOUNT" ELSE 0 END ELSE NULL END))), 0) - 1 END
  dax_expression: DIVIDE([NET_SALES],[NET_SALES_PM],0)-1
  aggregation_type: NONE
  grain: []
  synonyms:
  - Net Sales Variance %
  - NET_SALES_VARIANCE_PCT
