- name: NET_SALES_PM
  logical_name: NET_SALES_PM
  label: Net Sales PM
  sql_expression: SUM(CASE WHEN ANALYSIS_DAX."IS_PREV_MONTH" THEN CASE WHEN SALES.STATUS
    = 'Sold' THEN SALES."AMOUNT" ELSE 0 END ELSE NULL END)
  dax_expression: CALCULATE([NET_SALES],PREVIOUSMONTH('Calendar'[Date]))
  aggregation_type: NONE
  grain: []
  synonyms:
