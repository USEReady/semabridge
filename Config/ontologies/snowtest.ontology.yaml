- name: TotalSales
  logical_name: TOTALSALES
  label: TotalSales
  description: Calculated metric of Regular Sales Dollars for Total Sales (from Store_Sales).
  sql_expression: CASE WHEN (Sales."REGULAR_SALES_DOLLARS") IS NULL AND (Sales."MARKDOWN_SALES_DOLLARS")
    IS NULL THEN NULL ELSE COALESCE(Sales."REGULAR_SALES_DOLLARS", 0) + COALESCE(Sales."MARKDOWN_SALES_DOLLARS",
    0) END
  dax_expression: '[Regular_Sales_Dollars]+[Markdown_Sales_Dollars]'
  is_hidden: false
  aggregation_type: NONE
