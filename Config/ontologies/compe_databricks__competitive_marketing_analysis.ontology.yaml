- name: Pct_Units_Market_Share
  logical_name: PCT_UNITS_MARKET_SHARE
  label: '% Units Market Share'
  sql_expression: CASE WHEN COALESCE((SUM(CASE WHEN PRODUCT."ISVANARSDEL" = 'Yes'
    THEN SALESFACT."UNITS" ELSE NULL END)), 0) = 0 THEN 0 ELSE IFF(COALESCE((SUM(SALESFACT."UNITS")),
    0) = 0, 0, (SUM(CASE WHEN PRODUCT."ISVANARSDEL" = 'Yes' THEN SALESFACT."UNITS"
    ELSE NULL END)) / (SUM(SALESFACT."UNITS"))) END
  dax_expression: IF([Total_VanArsdel_Units]=0, 0, DIVIDE([Total_VanArsdel_Units],
    [Total_Units], 0))
  format_string: 0.0%;-0.0%;0.0%
  is_hidden: false
  aggregation_type: NONE
  grain: []
  synonyms:
  - '% Units Market Share'
  - Pct_Units_Market_Share
  business_rules: []
  domain: compe-databricks · Competitive Marketing Analysis
  concept: SalesFact
  tags: []
  origin: bi
