- name: Total_VanArsdel_Units_YTD
  logical_name: TOTAL_VANARSDEL_UNITS_YTD
  label: Total VanArsdel Units YTD
  sql_expression: SUM(CASE WHEN PRODUCT."ISVANARSDEL" = 'Yes' THEN CASE WHEN COL_DATE."COL_DATE"
    >= DATE_TRUNC('YEAR', CURRENT_DATE()) AND COL_DATE."COL_DATE" <= CURRENT_DATE()
    THEN SALESFACT."UNITS" ELSE NULL END ELSE NULL END)
  dax_expression: CALCULATE([Total_Units_YTD], FILTER(ALL(Product[isVanArsdel]), Product[isVanArsdel]="Yes"))
  format_string: '#,0'
  is_hidden: false
  aggregation_type: NONE
  grain: []
  synonyms:
