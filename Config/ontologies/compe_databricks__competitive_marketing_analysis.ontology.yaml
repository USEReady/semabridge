metrics:
- name: KPI01
  logical_name: KPI01
  label: KPI01
  dax_expression: IF(SUM('KPI'[KPI])=1,CONCATENATE(LEFT([Total_Units_YTD_Var_Pct2],3),("
    % ROI (Return on Investment)")),IF(SUM('KPI'[KPI])=2," ",IF(SUM('KPI'[KPI])=3,CALCULATE([Total_Category_Volume],'Date'[Running
    Year]=1))))
  format_string: \$#,0;(\$#,0);\$#,0
  is_hidden: false
  aggregation_type: NONE
  grain: []
  synonyms:
  - KPI01
  business_rules: []
  domain: compe-databricks · Competitive Marketing Analysis
  concept: KPI
  tags: []
  origin: bi
- name: KPI02
  logical_name: KPI02
  label: KPI02
  dax_expression: IF(SUM('KPI'[KPI])=1,(CALCULATE([Total_Category_Volume],'Date'[Running
    Year]=1)),IF(SUM('KPI'[KPI])=2," ",IF(SUM('KPI'[KPI])=3,CONCATENATE(LEFT([Total_Units_YTD_Var_Pct2],3),"%"))))
  format_string: \$#,0.###############;(\$#,0.###############);\$#,0.###############
  is_hidden: false
  aggregation_type: NONE
  grain: []
  synonyms:
  - KPI02
