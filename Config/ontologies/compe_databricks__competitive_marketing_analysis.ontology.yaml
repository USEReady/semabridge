- name: Total_Units_YTD
  logical_name: TOTAL_UNITS_YTD
  label: Total Units YTD
  sql_expression: SUM(CASE WHEN COL_DATE."COL_DATE" >= DATE_TRUNC('YEAR', CURRENT_DATE())
    AND COL_DATE."COL_DATE" <= CURRENT_DATE() THEN SALESFACT."UNITS" ELSE NULL END)
  dax_expression: TOTALYTD([Total_Units], 'Date'[Date])
  format_string: '#,0'
  is_hidden: false
  aggregation_type: NONE
  grain: []
  synonyms:
