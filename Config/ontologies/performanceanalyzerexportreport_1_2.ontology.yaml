metrics:
- name: MS_Since_Previous_Edge
  logical_name: MS_SINCE_PREVIOUS_EDGE
  label: MS Since Previous Edge
  sql_expression: CASE WHEN NOT COALESCE((((MIN(EVENTEDGES."TIMESTAMPMS")) IS NULL)),
    FALSE) THEN CASE WHEN ("PREVIOUSTIMESTAMPMS" IS NULL) THEN 0 ELSE CASE WHEN (MIN(EVENTEDGES."TIMESTAMPMS"))
    IS NULL AND ("PREVIOUSTIMESTAMPMS") IS NULL THEN NULL ELSE COALESCE((MIN(EVENTEDGES."TIMESTAMPMS")),
    0) - COALESCE("PREVIOUSTIMESTAMPMS", 0) END END END
  dax_expression: '

    VAR _Root = SELECTEDVALUE(EventEdges[Root])

    VAR _Rank = MIN(EventEdges[Rank])

    VAR _TimestampMs = MIN(EventEdges[timestampMs])

    VAR _PreviousTimestampMs = CALCULATE(MAX(''EventEdges''[timestampMs]), FILTER(ALL(EventEdges),
    ISBLANK(_Root) || [Root] = _Root && [Rank] < _Rank))

    RETURN IF(ISBLANK(_TimestampMs), BLANK(), IF(ISBLANK(_PreviousTimestampMs), 0,
    _TimestampMs - _PreviousTimestampMs))'
  is_hidden: false
  aggregation_type: NONE
  grain: []
  synonyms:
  - MS Since Previous Edge
  - MS_Since_Previous_Edge
  business_rules: []
  domain: PerformanceAnalyzerExportReport 1 2
  concept: EventEdges
  semantic_view_name: workspace.default.PerformanceAnalyzerExportReport_1_2_metric_view
  tags: []
  origin: bi
- name: MS_Since_First_Edge
  logical_name: MS_SINCE_FIRST_EDGE
  label: MS Since First Edge
  dax_expression: '

    VAR _CurrentTimestamp = MIN(''EventEdges''[timestampMs])

    RETURN IF(ISBLANK(_CurrentTimestamp), BLANK(), _CurrentTimestamp - CALCULATE(MIN(''EventEdges''[timestampMs]),
    ALLSELECTED(EventEdges)))'
  is_hidden: false
  aggregation_type: NONE
  grain: []
  synonyms:
  - MS Since First Edge
  - MS_Since_First_Edge
  business_rules: []
  domain: PerformanceAnalyzerExportReport 1 2
  concept: EventEdges
  semantic_view_name: workspace.default.PerformanceAnalyzerExportReport_1_2_metric_view
  tags: []
  origin: bi
- name: Data_Quality_Messages
  logical_name: DATA_QUALITY_MESSAGES
  label: Data Quality Messages
  sql_expression: CASE WHEN COALESCE((SUM(Metadata."RAWEVENTCOUNT"::FLOAT)), 0) >
    COALESCE((SUM(Metadata."UNIQUEEVENTCOUNT"::FLOAT)), 0) THEN 'Export file contains
    events with duplicate IDs.  Only unique events are shown in this report' END
  dax_expression: '

    VAR _RawEventCount = SUM(''Metadata''[RawEventCount])

    VAR _UniqueEventCount = SUM(''Metadata''[UniqueEventCount])

    RETURN IF(_RawEventCount > _UniqueEventCount, "Export file contains events with
    duplicate IDs.  Only unique events are shown in this report", BLANK())'
  is_hidden: false
  aggregation_type: NONE
  grain: []
  synonyms:
  - Data Quality Messages
  - Data_Quality_Messages
  business_rules: []
  domain: PerformanceAnalyzerExportReport 1 2
  concept: Metadata
  semantic_view_name: workspace.default.PerformanceAnalyzerExportReport_1_2_metric_view
  tags: []
  origin: bi
- name: DataStatus
  logical_name: DATASTATUS
  label: DataStatus
  sql_expression: CASE WHEN (Metadata."DATA_QUALITY_MESSAGES" IS NULL) THEN 0 ELSE
    1 END
  dax_expression: IF(ISBLANK([Data_Quality_Messages]), 0, 1)
  format_string: '0'
  is_hidden: false
  aggregation_type: NONE
  grain: []
  synonyms:
  - DataStatus
  business_rules: []
  derives_from:
  - Data_Quality_Messages
  domain: PerformanceAnalyzerExportReport 1 2
  concept: Metadata
