metrics:
- name: EMPLOYEES
  logical_name: EMPLOYEES
  label: Employees
  description: Total headcount for the period in scope.
  sql_expression: COUNT(EMPLOYEE."EMPLID")
  dax_expression: CALCULATE(COUNT([EmplID]), FILTER(ALL('Date'[Period number]), 'Date'[Period
    number] = MAX('Date'[Period number])))
  format_string: '#,0'
  is_hidden: false
  aggregation_type: NONE
  grain: []
  synonyms:
  - Employees
  business_rules: []
  domain: employee_hiring · Employee Hiring and History
  concept: Employee
  semantic_view_name: SEMABRIDGE.TESTING_SEMABRIDGE_CHECK.EMPLOYEE_HIRING_AND_HISTORY_SEMANTIC
  tags: []
  origin: bi
  bi_description: Total headcount for the period in scope.
- name: SEPARATIONS
  logical_name: SEPARATIONS
  label: Separations
  description: Number of employees who left the company in the period.
  sql_expression: COUNT(CASE WHEN (EMPLOYEE."TERMDATE" IS NOT NULL) THEN EMPLOYEE."EMPLID"
    END)
  dax_expression: CALCULATE(COUNT([EmplID]), FILTER(Employee, NOT(ISBLANK(Employee[TermDate]))))
  format_string: '#,0'
  is_hidden: false
  aggregation_type: NONE
  grain: []
  synonyms:
  - Separations
  business_rules: []
  domain: employee_hiring · Employee Hiring and History
  concept: Employee
  semantic_view_name: SEMABRIDGE.TESTING_SEMABRIDGE_CHECK.EMPLOYEE_HIRING_AND_HISTORY_SEMANTIC
  tags: []
  origin: bi
  bi_description: Number of employees who left the company in the period.
- name: ACTIVES
  logical_name: ACTIVES
  label: Actives
  description: Number of employees still working at the end of the period.
  sql_expression: COUNT(CASE WHEN (EMPLOYEE."TERMDATE" IS NULL) THEN EMPLOYEE."EMPLID"
    ELSE NULL END)
  dax_expression: CALCULATE([EMPLOYEES], FILTER(Employee, ISBLANK(Employee[TermDate])))
  format_string: '#,0'
  is_hidden: false
  aggregation_type: NONE
  grain: []
  synonyms:
  - Actives
  business_rules: []
  domain: employee_hiring · Employee Hiring and History
  concept: Employee
  semantic_view_name: SEMABRIDGE.TESTING_SEMABRIDGE_CHECK.EMPLOYEE_HIRING_AND_HISTORY_SEMANTIC
  tags: []
  origin: bi
  bi_description: Number of employees still working at the end of the period.
- name: NEW_HIRES
  logical_name: NEW_HIRES
  label: New Hires
  description: Number of employees hired in the period.
  sql_expression: SUM(EMPLOYEE."ISNEWHIRE")
  dax_expression: SUM([isNewHire])
  format_string: '#,0'
  is_hidden: false
  aggregation_type: NONE
  grain: []
  synonyms:
  - New Hires
  - NEW_HIRES
  business_rules: []
  domain: employee_hiring · Employee Hiring and History
  concept: Employee
  semantic_view_name: SEMABRIDGE.TESTING_SEMABRIDGE_CHECK.EMPLOYEE_HIRING_AND_HISTORY_SEMANTIC
  tags: []
  origin: bi
  bi_description: Number of employees hired in the period.
- name: AVG_TENURE_DAYS
  logical_name: AVG_TENURE_DAYS
  label: AVG Tenure Days
  description: Average employee tenure, in days.
  sql_expression: AVG(EMPLOYEE."TENUREDAYS")
  dax_expression: AVERAGE([TenureDays])
  format_string: '#,0'
  is_hidden: false
  aggregation_type: NONE
  grain: []
  synonyms:
  - AVG Tenure Days
  - AVG_TENURE_DAYS
  business_rules: []
  domain: employee_hiring · Employee Hiring and History
  concept: Employee
  semantic_view_name: SEMABRIDGE.TESTING_SEMABRIDGE_CHECK.EMPLOYEE_HIRING_AND_HISTORY_SEMANTIC
  tags: []
  origin: bi
  bi_description: Average employee tenure, in days.
- name: AVG_TENURE_MONTHS
  logical_name: AVG_TENURE_MONTHS
  label: AVG Tenure Months
  description: Average employee tenure, in months.
  sql_expression: CASE WHEN (ROUND((AVG(EMPLOYEE."TENUREDAYS")) / 30, 1)) IS NULL
    AND (1) IS NULL THEN NULL ELSE COALESCE(ROUND((AVG(EMPLOYEE."TENUREDAYS")) / 30,
    1), 0) - 1 END
  dax_expression: ROUND([AVG_TENURE_DAYS]/30, 1)-1
  format_string: '0'
  is_hidden: false
  aggregation_type: NONE
  grain: []
  synonyms:
  - AVG Tenure Months
  - AVG_TENURE_MONTHS
  business_rules: []
  domain: employee_hiring · Employee Hiring and History
  concept: Employee
  semantic_view_name: SEMABRIDGE.TESTING_SEMABRIDGE_CHECK.EMPLOYEE_HIRING_AND_HISTORY_SEMANTIC
  tags: []
  origin: bi
  bi_description: Average employee tenure, in months.
- name: AVG_AGE
