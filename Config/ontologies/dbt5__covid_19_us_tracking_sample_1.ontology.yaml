- name: Drill_through_button_text
  logical_name: DRILL_THROUGH_BUTTON_TEXT
  label: Drill-through button text
  sql_expression: CASE WHEN IFF(COUNT(DISTINCT StateDim."STATE") + MAX(IFF(StateDim."STATE"
    IS NULL, 1, 0)) = 1, MAX(StateDim."STATE"), 0) = "EQ" THEN 0 ELSE 'Click on a
    State to view by County  ' END
  dax_expression: IF(SELECTEDVALUE(StateDim[State],0)==0,"Click on a State to view
    by County  ", "Click here to view by County in " & VALUES(StateDim[State code])
    &"  ")
  is_hidden: false
