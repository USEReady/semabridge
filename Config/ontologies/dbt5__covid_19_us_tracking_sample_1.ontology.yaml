- name: Methodology
  logical_name: METHODOLOGY
  label: Methodology
  sql_expression: '''This interactive feature aggregates data from the Centers for
    Disease Control and Prevention (CDC), state- and local-level public health agencies.
    County-level data is confirmed by referencing state and local agencies directly.


    Source: USAFacts'''
