- name: Notes
  logical_name: NOTES
  label: Notes
  sql_expression: '''New York* covers 5 counties (Bronx, Kings, New York, Queens,
    Richmond), not New York county.


    City of St. Louis was renamed to St. Louis City.


    City and Borough of Juneau was renamed to Juneau Borough.


    Municipality of Anchorage was renamed to Anchorage.


    Jackson County includes other portions of Kansas City.



    Source: USAFacts'''
  dax_expression: '"New York* covers 5 counties (Bronx, Kings, New York, Queens, Richmond),
    not New York county.


    City of St. Louis was renamed to St. Louis City.


    City and Borough of Juneau was renamed to Juneau Borough.


    Municipality of Anchorage was renamed to Anchorage.


    Jackson County includes other portions of Kansas City.



    Source: USAFacts"'
