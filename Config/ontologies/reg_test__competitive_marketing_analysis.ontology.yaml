- name: KPI01
  logical_name: KPI01
  label: KPI01
  dax_expression: IF(SUM('KPI'[KPI])=1,CONCATENATE(LEFT([TOTAL_UNITS_YTD_VAR_PCT2],3),("
    % ROI (Return on Investment)")),IF(SUM('KPI'[KPI])=2," ",IF(SUM('KPI'[KPI])=3,CALCULATE([TOTAL_CATEGORY_VOLUME],'Date'[Running
    Year]=1))))
  format_string: \$#,0;(\$#,0);\$#,0
  is_hidden: false
  aggregation_type: NONE
