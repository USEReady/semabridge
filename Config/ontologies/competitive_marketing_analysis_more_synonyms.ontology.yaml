- name: PCT_UNITS_MARKET_SHARE
  logical_name: PCT_UNITS_MARKET_SHARE
  label: PCT_UNITS_MARKET_SHARE
  sql_expression: CASE WHEN (SUM(CASE WHEN PRODUCT."ISVANARSDEL" = 'Yes' THEN SALESFACT."UNITS"
    ELSE NULL END)) = 0 THEN 0 ELSE IFF(COALESCE((SUM(SALESFACT."UNITS")), 0) = 0,
    0, (SUM(CASE WHEN PRODUCT."ISVANARSDEL" = 'Yes' THEN SALESFACT."UNITS" ELSE NULL
    END)) / (SUM(SALESFACT."UNITS"))) END
  dax_expression: IF([TOTAL_VANARSDEL_UNITS]=0, 0, DIVIDE([TOTAL_VANARSDEL_UNITS],
    [TOTAL_UNITS], 0))
