    END::FLOAT) IS NOT NULL)) AND ((AVG(CASE WHEN YEAR."YEAR" = 2010 THEN INDICATORS."INCIDENCE_OF_TUBERCULOSIS_PER_100_000_POPULATION_PER_YEAR"
    END::FLOAT) IS NOT NULL)) THEN CASE WHEN (AVG(CASE WHEN YEAR."YEAR" = 2016 THEN
    INDICATORS."INCIDENCE_OF_TUBERCULOSIS_PER_100_000_POPULATION_PER_YEAR" END::FLOAT))
    IS NULL AND (AVG(CASE WHEN YEAR."YEAR" = 2010 THEN INDICATORS."INCIDENCE_OF_TUBERCULOSIS_PER_100_000_POPULATION_PER_YEAR"
    END::FLOAT)) IS NULL THEN NULL ELSE COALESCE(AVG(CASE WHEN YEAR."YEAR" = 2016
    THEN INDICATORS."INCIDENCE_OF_TUBERCULOSIS_PER_100_000_POPULATION_PER_YEAR" END::FLOAT),
    0) - COALESCE(AVG(CASE WHEN YEAR."YEAR" = 2010 THEN INDICATORS."INCIDENCE_OF_TUBERCULOSIS_PER_100_000_POPULATION_PER_YEAR"
    END::FLOAT), 0) END END
  dax_expression: If(not(isblank(CALCULATE(AVERAGE(Indicators[Incidence of tuberculosis
