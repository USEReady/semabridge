- name: LIFE_EXPECTANCY_COLOUR_CODING_FOR_CHART
  logical_name: LIFE_EXPECTANCY_COLOUR_CODING_FOR_CHART
  label: Life Expectancy Colour Coding For Chart
  sql_expression: CASE WHEN IFF(COUNT(DISTINCT YEARS."YEARS") + MAX(IFF(YEARS."YEARS"
    IS NULL, 1, 0)) = 1, MAX(YEARS."YEARS"), NULL) < IFF(COUNT(DISTINCT EXTRA_YEAR."EXTRA_YEAR")
    + MAX(IFF(EXTRA_YEAR."EXTRA_YEAR" IS NULL, 1, 0)) = 1, MAX(EXTRA_YEAR."EXTRA_YEAR"),
    NULL) THEN '#dddddd' WHEN COALESCE(Metrics."LIFE_EXPECTANCY_FOR_CHART", 0) <=
    30 THEN '#D64550' WHEN COALESCE(Metrics."LIFE_EXPECTANCY_FOR_CHART", 0) <= 45
    THEN '#DE6A3E' WHEN COALESCE(Metrics."LIFE_EXPECTANCY_FOR_CHART", 0) <= 60 THEN
    '#E89928' WHEN COALESCE(Metrics."LIFE_EXPECTANCY_FOR_CHART", 0) <= 70 THEN '#E89928'
    WHEN COALESCE(Metrics."LIFE_EXPECTANCY_FOR_CHART", 0) <= 80 THEN '#65606A' ELSE
    '#474A7D' END
  dax_expression: "\nSWITCH(\n    TRUE(),\n    SELECTEDVALUE('Years'[Years])<SELECTEDVALUE('Extra\
    \ Year'[Extra year]), \"#dddddd\", \n    [LIFE_EXPECTANCY_FOR_CHART]<=30, \"#D64550\"\
    ,\n    [LIFE_EXPECTANCY_FOR_CHART]<=45, \"#DE6A3E\",\n    [LIFE_EXPECTANCY_FOR_CHART]<=60,\
