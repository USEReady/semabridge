<svg width="100%" viewBox="0 0 680 200" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>SemaBridge — One Semantic Layer. Every Platform.</title>
  <desc>SemaBridge GitHub banner</desc>

  <style>
    @keyframes np { 0%,100%{opacity:.5} 50%{opacity:1} }
    .n1{animation:np 2.6s ease-in-out infinite}
    .n2{animation:np 2.6s ease-in-out infinite .65s}
    .n3{animation:np 2.6s ease-in-out infinite 1.3s}
  </style>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050d1f"/>
      <stop offset="100%" stop-color="#071628"/>
    </linearGradient>
    <linearGradient id="ig" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f8ef7"/>
      <stop offset="100%" stop-color="#38d4c0"/>
    </linearGradient>
    <linearGradient id="tg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#d6eeff"/>
      <stop offset="100%" stop-color="#38d4c0"/>
    </linearGradient>
    <linearGradient id="topLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4f8ef7" stop-opacity="0"/>
      <stop offset="20%" stop-color="#4f8ef7"/>
      <stop offset="50%" stop-color="#a0d4ff"/>
      <stop offset="80%" stop-color="#38d4c0"/>
      <stop offset="100%" stop-color="#38d4c0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="divL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4f8ef7" stop-opacity="0"/>
      <stop offset="30%" stop-color="#4f8ef7"/>
      <stop offset="70%" stop-color="#38d4c0"/>
      <stop offset="100%" stop-color="#38d4c0" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="680" height="200" rx="14" fill="url(#bg)"/>

  <line x1="0" y1="50" x2="680" y2="50" stroke="#0f2040" stroke-width="0.5"/>
  <line x1="0" y1="100" x2="680" y2="100" stroke="#0f2040" stroke-width="0.5"/>
  <line x1="0" y1="150" x2="680" y2="150" stroke="#0f2040" stroke-width="0.5"/>
  <line x1="85" y1="0" x2="85" y2="200" stroke="#0f2040" stroke-width="0.5"/>
  <line x1="170" y1="0" x2="170" y2="200" stroke="#0f2040" stroke-width="0.5"/>
  <line x1="255" y1="0" x2="255" y2="200" stroke="#0f2040" stroke-width="0.5"/>
  <line x1="340" y1="0" x2="340" y2="200" stroke="#0f2040" stroke-width="0.5"/>
  <line x1="425" y1="0" x2="425" y2="200" stroke="#0f2040" stroke-width="0.5"/>
  <line x1="510" y1="0" x2="510" y2="200" stroke="#0f2040" stroke-width="0.5"/>
  <line x1="595" y1="0" x2="595" y2="200" stroke="#0f2040" stroke-width="0.5"/>

  <rect x="0" y="0" width="680" height="3" rx="2" fill="url(#topLine)"/>
  <rect x="0" y="197" width="680" height="3" rx="2" fill="url(#divL)" opacity="0.5"/>

  <g transform="translate(256, 52) scale(2.0)">
    <defs>
      <linearGradient id="ig2" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#4f8ef7"/>
        <stop offset="100%" stop-color="#38d4c0"/>
      </linearGradient>
    </defs>
    <rect x="4" y="28" width="5" height="16" rx="2.5" fill="url(#ig2)"/>
    <rect x="39" y="28" width="5" height="16" rx="2.5" fill="url(#ig2)"/>
    <rect x="2" y="33" width="44" height="3" rx="1.5" fill="url(#ig2)" opacity="0.25"/>
    <path d="M6.5 34 Q24 5 41.5 34" stroke="url(#ig2)" stroke-width="3" fill="none" stroke-linecap="round"/>
    <line x1="13.5" y1="19.5" x2="13.5" y2="33" stroke="#4f8ef7" stroke-width="1.2" opacity="0.45"/>
    <line x1="24" y1="10.5" x2="24" y2="33" stroke="url(#ig2)" stroke-width="1.2" opacity="0.45"/>
    <line x1="34.5" y1="19.5" x2="34.5" y2="33" stroke="#38d4c0" stroke-width="1.2" opacity="0.45"/>
    <circle cx="13.5" cy="19.5" r="3.2" fill="#050d1f" stroke="#4f8ef7" stroke-width="2" class="n1"/>
    <circle cx="24" cy="10.5" r="4" fill="#050d1f" stroke="url(#ig2)" stroke-width="2.2" class="n2"/>
    <circle cx="34.5" cy="19.5" r="3.2" fill="#050d1f" stroke="#38d4c0" stroke-width="2" class="n3"/>
    <circle cx="13.5" cy="19.5" r="1.4" fill="#4f8ef7"/>
    <circle cx="24" cy="10.5" r="1.8" fill="url(#ig2)"/>
    <circle cx="34.5" cy="19.5" r="1.4" fill="#38d4c0"/>
  </g>

  <text x="340" y="145"
    text-anchor="middle"
    font-family="Arial Black, Arial, sans-serif"
    font-size="52"
    font-weight="900"
    fill="url(#tg)"
    letter-spacing="-1">SemaBridge</text>

  <text x="340" y="170"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="13"
    fill="#4a8aaa"
    letter-spacing="3">ONE SEMANTIC LAYER. EVERY PLATFORM.</text>
</svg>
