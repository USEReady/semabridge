# =============================================================================
# Sales Semantic Model — Version 2 (Updated)
# Format: OSI v1.0 (Open Semantic Interchange)
# Use this as FILE 2 in the Semantic Comparator
#
# Changes from V1:
#   MODIFIED metrics  (LLM button will appear on each):
#     - Net_Revenue          → equivalent logic, different SQL style
#     - Revenue_After_Tax    → equivalent logic, reordered terms
#     - Profit_After_Discount→ equivalent logic, expanded SUM()s
#     - Avg_Order_Value      → DIFFERENT: AVG() vs SUM()/COUNT()
#     - Avg_Discount_Rate    → DIFFERENT: aggregate ratio vs row-level avg
#     - Revenue_Per_Customer → DIFFERENT: non-distinct COUNT vs COUNT DISTINCT
#
#   ADDED metrics (Only in F2):
#     - YoY_Revenue_Growth
#     - Discount_Impact
#
#   REMOVED metrics (Only in F1):
#     - Total_Tax
#     - Unique_Customers
#
#   ADDED column (Only in F2):
#     - Fact_Sales.channel
#
#   REMOVED column (Only in F1):
#     - Dim_Customer.acquisition_date
# =============================================================================

datasets:

  - unique_name: Fact_Sales
    description: "Core sales transactions fact table"
    source_table: "sales_db.public.fact_sales"
    columns:
      - unique_name: sale_id
        data_type: integer
        is_key: true
      - unique_name: order_date
        data_type: date
      - unique_name: customer_id
        data_type: integer
      - unique_name: product_id
        data_type: integer
      - unique_name: region_id
        data_type: integer
      - unique_name: gross_amount
        data_type: decimal
      - unique_name: discount_amount
        data_type: decimal
      - unique_name: tax_amount
        data_type: decimal
      - unique_name: quantity
        data_type: integer
      - unique_name: cost_amount
        data_type: decimal
      # NEW in V2 — sales channel tracking added
      - unique_name: channel
        data_type: varchar

  - unique_name: Dim_Customer
    description: "Customer dimension"
    source_table: "sales_db.public.dim_customer"
    columns:
      - unique_name: customer_id
        data_type: integer
        is_key: true
      - unique_name: customer_name
        data_type: varchar
      - unique_name: customer_segment
        data_type: varchar
      - unique_name: country
        data_type: varchar
      # acquisition_date REMOVED in V2 (moved to CRM system)

  - unique_name: Dim_Product
    description: "Product dimension"
    source_table: "sales_db.public.dim_product"
    columns:
      - unique_name: product_id
        data_type: integer
        is_key: true
      - unique_name: product_name
        data_type: varchar
      - unique_name: category
        data_type: varchar
      - unique_name: unit_cost
        data_type: decimal

  - unique_name: Dim_Region
    description: "Regional dimension"
    source_table: "sales_db.public.dim_region"
    columns:
      - unique_name: region_id
        data_type: integer
        is_key: true
      - unique_name: region_name
        data_type: varchar
      - unique_name: country
        data_type: varchar

metrics:

  # ── Revenue Metrics ────────────────────────────────────────────────────────

  - unique_name: Total_Revenue
    description: "Total gross revenue before discounts and tax"
    dataset: Fact_Sales
    source_column: gross_amount
    aggregation: sum

  # MODIFIED — V1: SUM(a) - SUM(b), V2: SUM(a - b)
  # LLM Expected: EQUIVALENT — both are mathematically identical for SUM
  - unique_name: Net_Revenue
    description: "Revenue after discounts, before tax"
    dataset: Fact_Sales
    expression: "SUM(gross_amount - discount_amount)"

  # Total_Tax REMOVED in V2

  # MODIFIED — V1: SUM(a) - SUM(b) + SUM(c), V2: SUM(a + c) - SUM(b)
  # LLM Expected: EQUIVALENT — addition is commutative and associative
  - unique_name: Revenue_After_Tax
    description: "Net revenue inclusive of tax (gross minus discount plus tax)"
    dataset: Fact_Sales
    expression: "SUM(gross_amount + tax_amount) - SUM(discount_amount)"

  # ── Profitability Metrics ──────────────────────────────────────────────────

  - unique_name: Gross_Profit
    description: "Gross profit: revenue minus cost of goods sold"
    dataset: Fact_Sales
    expression: "SUM(gross_amount) - SUM(cost_amount)"

  - unique_name: Gross_Margin_Pct
    description: "Gross margin as a percentage of gross revenue"
    dataset: Fact_Sales
    expression: "ROUND((SUM(gross_amount) - SUM(cost_amount)) / NULLIF(SUM(gross_amount), 0) * 100, 2)"

  # MODIFIED — V1: SUM(a - b - c), V2: SUM(a) - SUM(b) - SUM(c)
  # LLM Expected: EQUIVALENT — SUM distributes over subtraction
  - unique_name: Profit_After_Discount
    description: "Profit after applying customer discounts"
    dataset: Fact_Sales
    expression: "SUM(gross_amount) - SUM(discount_amount) - SUM(cost_amount)"

  # ── Volume Metrics ─────────────────────────────────────────────────────────

  - unique_name: Total_Units_Sold
    description: "Total quantity of units sold"
    dataset: Fact_Sales
    source_column: quantity
    aggregation: sum

  - unique_name: Total_Orders
    description: "Count of distinct sales orders"
    dataset: Fact_Sales
    source_column: sale_id
    aggregation: count

  # MODIFIED — V1: SUM(gross_amount) / NULLIF(COUNT(sale_id), 0)
  #             V2: AVG(gross_amount)
  # LLM Expected: DIFFERENT — AVG() divides by row count including NULLs;
  #               SUM/COUNT(sale_id) counts non-NULL IDs. Results differ with NULLs.
  - unique_name: Avg_Order_Value
    description: "Average revenue per order"
    dataset: Fact_Sales
    expression: "AVG(gross_amount)"

  # MODIFIED — V1: AVG(discount_amount / NULLIF(gross_amount, 0)) * 100  (row-level avg)
  #             V2: SUM(discount_amount) / NULLIF(SUM(gross_amount), 0) * 100  (aggregate ratio)
  # LLM Expected: DIFFERENT — these are different statistics:
  #               V1 = average of per-row discount rates (weighted equally per row)
  #               V2 = total discount as % of total revenue (weighted by order size)
  - unique_name: Avg_Discount_Rate
    description: "Discount as a percentage of total revenue"
    dataset: Fact_Sales
    expression: "SUM(discount_amount) / NULLIF(SUM(gross_amount), 0) * 100"

  # ── Customer Metrics ───────────────────────────────────────────────────────

  # Unique_Customers REMOVED in V2

  # MODIFIED — V1: / NULLIF(COUNT(DISTINCT customer_id), 0)
  #             V2: / NULLIF(COUNT(customer_id), 0)
  # LLM Expected: DIFFERENT — V1 divides by unique customers;
  #               V2 divides by total transactions (a customer buying twice counts twice)
  - unique_name: Revenue_Per_Customer
    description: "Average revenue per transaction (note: not per unique customer)"
    dataset: Fact_Sales
    expression: "SUM(gross_amount) / NULLIF(COUNT(customer_id), 0)"

  # ── NEW Metrics in V2 ─────────────────────────────────────────────────────

  - unique_name: YoY_Revenue_Growth
    description: "Year-over-year revenue growth percentage"
    dataset: Fact_Sales
    expression: |
      (SUM(CASE WHEN YEAR(order_date) = YEAR(CURRENT_DATE) THEN gross_amount ELSE 0 END) -
       SUM(CASE WHEN YEAR(order_date) = YEAR(CURRENT_DATE) - 1 THEN gross_amount ELSE 0 END)) /
      NULLIF(SUM(CASE WHEN YEAR(order_date) = YEAR(CURRENT_DATE) - 1 THEN gross_amount ELSE 0 END), 0) * 100

  - unique_name: Discount_Impact
    description: "Total revenue lost due to discounts"
    dataset: Fact_Sales
    source_column: discount_amount
    aggregation: sum

relationships:

  - unique_name: sales_to_customer
    from_dataset: Fact_Sales
    from_columns: [customer_id]
    to_dataset: Dim_Customer
    to_columns: [customer_id]
    cardinality: many-to-one

  - unique_name: sales_to_product
    from_dataset: Fact_Sales
    from_columns: [product_id]
    to_dataset: Dim_Product
    to_columns: [product_id]
    cardinality: many-to-one

  - unique_name: sales_to_region
    from_dataset: Fact_Sales
    from_columns: [region_id]
    to_dataset: Dim_Region
    to_columns: [region_id]
    cardinality: many-to-one
