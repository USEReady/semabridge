# Fabric Compatibility Mode
# For use when moving complex PBI Semantic Models to Snowflake.

snowflake:
  # PowerBI often uses spaces in column names, which requires quoting
  quote_identifiers: true
  use_transient_tables: true # Faster staging

fabric:
  tmsl_generation_mode: "compatibility"

semantic_model:
  view_suffix: "" # Use direct table names if possible
  
compatibility:
  force_uppercase: false # Preserve case for PBI compatibility
