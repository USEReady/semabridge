# Example: TPC-H Multi-Table Metric View Configuration
#
# This example demonstrates how to configure semabridge to generate
# multi-table metric views for a TPC-H Orders → Customer → Nation
# snowflake schema pattern.
#
# To use this example:
# 1. Set up a Databricks workspace with sample.tpch databases loaded
# 2. Copy the databricks configuration section below to your Config/behavior.yaml
# 3. Enable the feature flags: enable_cross_table_joins + enable_metric_view_joins
# 4. Run: semabridge sync --model tpch_model

snowflake:
  apply_inferred_types: true

features:
  offline_mode: false
  offline_fabric_model_path: output/debug/raw_fabric_model.json

semantic_model:
  sync_all_attributes: true

# ─────────────────────────────────────────────────────────────────────────────
# Databricks Multi-Table Metric View Configuration
# ─────────────────────────────────────────────────────────────────────────────
databricks:
  # Metadata and deployment options
  create_metadata_table: true
  create_measure_views: true
  measure_view_type: "metric_view"        # Use native Databricks metric views
  measure_view_mode: "combined"            # One view per dataset with joins
  view_prefix: "mv"
  
  # DAX Translation
  enable_simple_dax_translation: true
  metric_view_only_sum_translation: true
  
  # ⭐ MULTI-TABLE METRIC VIEW CONFIGURATION
  # These two flags must be TRUE to enable multi-table joins
  enable_cross_table_joins: true           # Required: enables join resolution
  enable_metric_view_joins: true           # NEW: enables metric view 'joins' property
  
  # Cross-table fallback (keep false for metric-view-first)
  enable_cross_table_sql_fallback: false
  enable_low_confidence_drafts: true
  emit_metric_views_for_all_datasets: true
  
  # Table mappings for TPC-H sample data
  # Map Fabric semantic names → Databricks physical tables
  source_table_mapping:
    orders: "samples.tpch.orders"
    customer: "samples.tpch.customer"
    nation: "samples.tpch.nation"
    region: "samples.tpch.region"
    part: "samples.tpch.part"
    partsupp: "samples.tpch.partsupp"
    supplier: "samples.tpch.supplier"
    lineitem: "samples.tpch.lineitem"
  
  # Column name overrides (if physical column names differ from semantic names)
  source_column_mapping:
    orders:
      "OrderKey": "o_orderkey"
      "CustomerKey": "o_custkey"
      "TotalPrice": "o_totalprice"
      "OrderDate": "o_orderdate"
    customer:
      "CustomerKey": "c_custkey"
      "NationKey": "c_nationkey"
      "CustomerName": "c_name"
      "Address": "c_address"
    nation:
      "NationKey": "n_nationkey"
      "NationName": "n_name"
      "RegionKey": "n_regionkey"
  
  source_catalog: "samples"
  source_schema: "tpch"
  on_missing_source: "plan"
  
  # Optional: grant permissions on deployed views
  grant_select_to_groups:
    # - "analysts"
    # - "data_engineers"
  
  # transfer_ownership_to: "analytics_team"


# ─────────────────────────────────────────────────────────────────────────────
# Expected Generated Metric View YAML
# ─────────────────────────────────────────────────────────────────────────────
#
# When you run `semabridge sync` with this configuration, the following metric
# view YAML will be generated for the orders dataset:
#
# ---
# version: 1.1
# comment: "Semabridge: tpch_model - orders"
# source: SELECT * FROM samples.tpch.orders
#
# joins:
#   - name: customer
#     source: samples.tpch.customer
#     'on': o_custkey = c_custkey
#     joins:
#       - name: nation
#         source: samples.tpch.nation
#         'on': c_nationkey = n_nationkey
#
# dimensions:
#   - name: order_key
#     expr: `o_orderkey`
#   - name: customer_key
#     expr: `o_custkey`
#   - name: customer_name
#     expr: customer.c_name
#   - name: nation_name
#     expr: customer.nation.n_name
#   - name: order_date
#     expr: `o_orderdate`
#
# measures:
#   - name: order_count
#     expr: count(distinct o_orderkey)
#   - name: total_revenue
#     expr: sum(o_totalprice)
#   - name: average_order_value
#     expr: avg(o_totalprice)
# ---
#
# This metric view is deployed to Databricks as:
# CREATE OR REPLACE METRIC VIEW mv_orders (comment: "Semabridge: tpch_model - orders") ...
#
# Users can then query it directly without needing to write JOIN logic:
# SELECT customer_name, nation_name, order_count, total_revenue
# FROM mv_orders
# WHERE customer_name = 'Customer#000000001'


# ─────────────────────────────────────────────────────────────────────────────
# Example Queries Against Multi-Table Metric View
# ─────────────────────────────────────────────────────────────────────────────
#
# After deployment, BI tools can query the metric view directly:
#
# 1. Simple aggregation:
#    SELECT SUM(total_revenue) FROM mv_orders
#    → Returns total revenue across all orders
#
# 2. Slice by dimension:
#    SELECT nation_name, SUM(total_revenue)
#    FROM mv_orders
#    GROUP BY nation_name
#    → Returns revenue by nation (via customer join)
#
# 3. Filter on joined table:
#    SELECT *
#    FROM mv_orders
#    WHERE nation_name = 'United States'
#    → Returns orders from customers in US (cross-table filter)
#
# 4. Multi-level drill-down:
#    SELECT customer_name, nation_name, order_count
#    FROM mv_orders
#    GROUP BY customer_name, nation_name
#    → Slices orders by customer and their nation
#
# The metric view hides the complexity of the three-table join from the user!
