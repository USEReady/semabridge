        - name: SENTIMENT
          description: ''
          expr: AVG(salesfact."SCORE")
        - name: TOTAL_UNITS_YTD
          description: '[DAX: TOTALYTD([TOTAL_UNITS], ''Date''[Date])]'
          expr: 'NULL'
        - name: TOTAL_VANARSDEL_UNITS_YTD
          description: |-
            [DAX: CALCULATE([TOTAL_UNITS_YTD], FILTER(ALL(Product[isVanArsdel]), Product[isVanArsdel]="Yes"))]
          expr: 'NULL'
          synonyms:
            - Total Van Arsdel Units Ytd
        - name: TOTAL_OTHER_UNITS_YTD
          description: |-
            [DAX: CALCULATE([TOTAL_UNITS_YTD], FILTER(ALL(Product[isVanArsdel]), Product[isVanArsdel]="No"))]
          expr: 'NULL'
        - name: TOTAL_VANARSDEL_UNITS
          description: |-
            [DAX: CALCULATE([TOTAL_UNITS], FILTER(ALL(Product[isVanArsdel]), Product[isVanArsdel]="Yes"))]
          expr: 'NULL'
          synonyms:
            - Total Van Arsdel Units
        - name: TOTAL_OTHER_UNITS
          description: |-
            [DAX: CALCULATE([TOTAL_UNITS], FILTER(ALL(Product[isVanArsdel]), Product[isVanArsdel]="No"))]
          expr: 'NULL'
        - name: PCT_UNITS_MARKET_SHARE
          description: ''
          expr: |-
            COALESCE((SUM(salesfact."TOTAL_VANARSDEL_UNITS")) / NULLIF(SUM(salesfact."TOTAL_UNITS"), 0), 0)
          synonyms:
            - '% Units Market Share R12M and % Units Market Share by Month'
        - name: TOTAL_CATEGORY_VOLUME
          description: ''
          expr: (SUM(salesfact."UNITS"))
          synonyms:
            - Total Sales by Product and Channel
            - Total Sales by Channel Over Time
            - Total Sales by Channel and State
            - Sales and ROI Over Time
            - Total Sales by City
        - name: TOTAL_COMPETE_VOLUME
          description: ''
          expr: SUM(CASE WHEN PRODUCT.ISVANARSDEL = 'No' THEN salesfact."UNITS" ELSE 0 END)
        - name: PCT_CATEGORY_COMPETE_SHARE
          description: ''
          expr: |-
            FLOOR(DIV0((SUM(CASE WHEN PRODUCT.ISVANARSDEL = 'No' THEN salesfact."UNITS" ELSE 0 END)), (SUM(salesfact."UNITS"))) * 100)
        - name: TOTAL_UNITS_SPLY
          description: ''
          expr: |-
            SUM(CASE WHEN DATE_PART('YEAR', COL_DATE."COL_DATE") = DATE_PART('YEAR', DATEADD(YEAR, -1, SALESFACT."MAX_DATE")) AND COL_DATE."COL_DATE" BETWEEN DATEADD(YEAR, -1, DATE_TRUNC('YEAR', SALESFACT."MAX_DATE")) AND DATEADD(YEAR, -1, SALESFACT."MAX_DATE") THEN salesfact."TOTAL_UNITS" ELSE 0 END)
        - name: TOTAL_UNITS_YTD_SPLY
          description: ''
          expr: |-
            SUM(CASE WHEN DATE_PART('YEAR', COL_DATE."COL_DATE") = DATE_PART('YEAR', DATEADD(YEAR, -1, SALESFACT."MAX_DATE")) AND COL_DATE."COL_DATE" BETWEEN DATEADD(YEAR, -1, DATE_TRUNC('YEAR', SALESFACT."MAX_DATE")) AND DATEADD(YEAR, -1, SALESFACT."MAX_DATE") THEN salesfact."TOTAL_UNITS_YTD" ELSE 0 END)
        - name: TOTAL_VANARSDEL_UNITS_YTD_SPLY
          description: ''
          expr: |-
            SUM(CASE WHEN DATE_PART('YEAR', COL_DATE."COL_DATE") = DATE_PART('YEAR', DATEADD(YEAR, -1, SALESFACT."MAX_DATE")) AND COL_DATE."COL_DATE" BETWEEN DATEADD(YEAR, -1, DATE_TRUNC('YEAR', SALESFACT."MAX_DATE")) AND DATEADD(YEAR, -1, SALESFACT."MAX_DATE") THEN salesfact."TOTAL_VANARSDEL_UNITS_YTD" ELSE 0 END)
          synonyms:
            - Total Van Arsdel Units Ytd Sply
        - name: TOTAL_OTHER_UNITS_YTD_SPLY
          description: ''
          expr: |-
            SUM(CASE WHEN DATE_PART('YEAR', COL_DATE."COL_DATE") = DATE_PART('YEAR', DATEADD(YEAR, -1, SALESFACT."MAX_DATE")) AND COL_DATE."COL_DATE" BETWEEN DATEADD(YEAR, -1, DATE_TRUNC('YEAR', SALESFACT."MAX_DATE")) AND DATEADD(YEAR, -1, SALESFACT."MAX_DATE") THEN salesfact."TOTAL_OTHER_UNITS_YTD" ELSE 0 END)
        - name: PCT_UNITS_MARKET_SHARE_YTD
          description: ''
          expr: |-
            COALESCE((SUM(salesfact."TOTAL_VANARSDEL_UNITS_YTD")) / NULLIF(SUM(salesfact."TOTAL_UNITS_YTD"), 0), 0)
        - name: PCT_MARKET_SHARE_SPLY_YTD
          description: ''
          expr: |-
            SUM(CASE WHEN DATE_PART('YEAR', COL_DATE."COL_DATE") = DATE_PART('YEAR', DATEADD(YEAR, -1, SALESFACT."MAX_DATE")) AND COL_DATE."COL_DATE" BETWEEN DATEADD(YEAR, -1, DATE_TRUNC('YEAR', SALESFACT."MAX_DATE")) AND DATEADD(YEAR, -1, SALESFACT."MAX_DATE") THEN salesfact."PCT_UNITS_MARKET_SHARE_YTD" ELSE 0 END)
        - name: PCT_UNIT_MARKET_SHARE_YOY_CHANGE
          description: ''
          expr: |-
            (COALESCE((SUM(salesfact."TOTAL_VANARSDEL_UNITS")) / NULLIF(SUM(salesfact."TOTAL_UNITS"), 0), 0))-(SUM(CASE WHEN DATE_PART('YEAR', COL_DATE."COL_DATE") = DATE_PART('YEAR', DATEADD(YEAR, -1, SALESFACT."MAX_DATE")) AND COL_DATE."COL_DATE" BETWEEN DATEADD(YEAR, -1, DATE_TRUNC('YEAR', SALESFACT."MAX_DATE")) AND DATEADD(YEAR, -1, SALESFACT."MAX_DATE") THEN salesfact."PCT_UNITS_MARKET_SHARE" ELSE 0 END))
        - name: PCT_UNITS_MARKET_SHARE_SPLY
          description: ''
          expr: |-
            SUM(CASE WHEN DATE_PART('YEAR', COL_DATE."COL_DATE") = DATE_PART('YEAR', DATEADD(YEAR, -1, SALESFACT."MAX_DATE")) AND COL_DATE."COL_DATE" BETWEEN DATEADD(YEAR, -1, DATE_TRUNC('YEAR', SALESFACT."MAX_DATE")) AND DATEADD(YEAR, -1, SALESFACT."MAX_DATE") THEN salesfact."PCT_UNITS_MARKET_SHARE" ELSE 0 END)
        - name: TOTAL_UNITS_R12MS
          description: |-
            [DAX: CALCULATE(SUM([Units]), FILTER(ALL('Date'), 'Date'[MonthIndex]<=MAX('Date'[MonthIndex])&& 'Date'[Mon...]
          expr: 'NULL'
        - name: TOTAL_VANARSDEL_UNITS_R12M
          description: |-
            [DAX: CALCULATE([TOTAL_UNITS_R12MS], FILTER(ALL(Product[isVanArsdel]), Product[isVanArsdel]="Yes"))]
          expr: 'NULL'
          synonyms:
            - Total Van Arsdel Units R12M
        - name: TOTAL_OTHER_UNITS_R12M
          description: |-
            [DAX: CALCULATE([TOTAL_UNITS_R12MS], FILTER(ALL(Product[isVanArsdel]), Product[isVanArsdel]="No"))]
          expr: 'NULL'
        - name: PCT_UNITS_MARKET_SHARE_R12M
          description: ''
          expr: |-
            COALESCE((SUM(salesfact."TOTAL_VANARSDEL_UNITS_R12M")) / NULLIF(SUM(salesfact."TOTAL_UNITS_R12MS"), 0), 0)
          synonyms:
            - '% Units Market Share R12M and % Units Market Share by Month'
        - name: SENTIMENT_GAP
          description: ''
          expr: |-
            AVG(CASE WHEN MANUFACTURER."MFGISVANARSDEL" = 'Yes' THEN SENTIMENT."SCORE" ELSE NULL END) - AVG(CASE WHEN MANUFACTURER."MFGISVANARSDEL" = 'No' THEN SENTIMENT."SCORE" ELSE NULL END)
        - name: TOTAL_UNITS_YTD_VAR
          description: '[DAX: [TOTAL_UNITS_YTD]-[TOTAL_UNITS_YTD_SPLY]]'
          expr: 'NULL'
        - name: TOTAL_UNITS_YTD_VAR_PCT
          description: ''
          expr: |-
            COALESCE((SUM(salesfact."TOTAL_UNITS_YTD_VAR")) / NULLIF(SUM(salesfact."TOTAL_UNITS_SPLY"), 0), 0)
          synonyms:
            - Sales and ROI Over Time
        - name: SUM_OF_UNITS
          description: ''
          expr: SUM(salesfact."UNITS")
        - name: SUM_OF_REVENUE
          description: ''
          expr: SUM(salesfact."REVENUE")
        - name: ATINDICATOR01
          description: ''
          expr: |-
            CASE WHEN salesfact."%_CATEGORY_COMPETE_SHARE" < 0.55 THEN 1 ELSE CASE WHEN salesfact."%_CATEGORY_COMPETE_SHARE" > 0.6 THEN 3 ELSE 2 END END
          synonyms:
            - Total Sales by Product and Channel
        - name: ATINDICATOR02
          description: ''
          expr: |-
            CASE WHEN salesfact."%_UNIT_MARKET_SHARE_YOY_CHANGE" < 0 THEN 1 ELSE CASE WHEN salesfact."%_UNIT_MARKET_SHARE_YOY_CHANGE" > "_" THEN 2 ELSE 3 END END
        - name: NUMSPACE01
          description: '[DAX: "" ]'
          expr: 'NULL'
        - name: NUMSPACE02
          description: '[DAX: "" ]'
          expr: 'NULL'
        - name: ATINDICATOR03
          description: ''
          expr: |-
            CASE WHEN salesfact."TOTAL_UNITS_YTD_VAR_%" < 0 THEN 1 ELSE CASE WHEN salesfact."TOTAL_UNITS_YTD_VAR_%" > 0.1 THEN 3 ELSE 2 END END
        - name: ATINDICATOR04
          description: ''
          expr: |-
            CASE WHEN salesfact."SENTIMENT" < 65 THEN 1 ELSE CASE WHEN salesfact."SENTIMENT" > 67 THEN 3 ELSE 2 END END
        - name: ATINDICATOR05
          description: ''
          expr: |-
            CASE WHEN salesfact."SENTIMENT_GAP" < 15 THEN 1 ELSE CASE WHEN salesfact."SENTIMENT_GAP" > 25 THEN 3 ELSE 2 END END
        - name: ATINDICATOR04A
          description: ''
          expr: |-
            CASE WHEN salesfact."@INDICATOR04" = 1 THEN 'Low Sentiment Rate' ELSE CASE WHEN salesfact."@INDICATOR04" = 3 THEN 'High Sentiment Rate' ELSE 'Medium Sentiment Rate' END END
        - name: ATINDICATOR05A
          description: ''
          expr: |-
            CASE WHEN salesfact."@INDICATOR05" = 1 THEN 'Low Sentiment Gap' ELSE CASE WHEN salesfact."@INDICATOR05" = 3 THEN 'High Sentiment Gap' ELSE 'Medium Sentiment Gap' END END
        - name: TOTAL_UNITS_YTD_VAR_PCT2
          description: '[DAX: INT(DIVIDE([TOTAL_UNITS_YTD_VAR],[TOTAL_UNITS_SPLY])*100)]'
          expr: 'NULL'
