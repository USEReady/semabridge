models:
  Inventory Semantic Model:
    preferred_root_table: Inventory_Fact
    ignore_tables:
      - Project_Measures
      
    # Safely embeds scalar threshold directly into root SELECT
    source_columns_sql:
      - "(SELECT MAX(fiscal_yr_period) FROM semabridge.public.Dates WHERE cal_dt = CURRENT_DATE()) AS `_current_fiscal_period`"
      
    # Overrides compare natively against the self-bootstrapped query column!
    measure_sql_overrides:
      "Corporate IOH": |-
        SUM(CASE
          WHEN fiscal_yr_period < _current_fiscal_period
          THEN corporatedsi.ioh_excldng_lifo_amt ELSE 0
        END)
      "Corporate COS": |-
        SUM(CASE
          WHEN fiscal_yr_period < _current_fiscal_period
          THEN corporatedsi.cos_excldng_lifo_amt ELSE 0
        END)
      "Corporate DSI Monthly": |-
        SUM(CASE
          WHEN fiscal_yr_period < _current_fiscal_period
          THEN corporatedsi.dsi_mnthly ELSE 0
        END)
      "Corporate DSI Quarterly": |-
        SUM(CASE
          WHEN fiscal_yr_period < _current_fiscal_period
          THEN corporatedsi.dsi_qtd ELSE 0
        END)
      "Corporate DSI Yearly": |-
        SUM(CASE
          WHEN fiscal_yr_period < _current_fiscal_period
          THEN corporatedsi.dsi_yrly ELSE 0
        END)
      "Source Value Total Stock": |-
        SUM(Inventory_Fact.source_value_total_stock)
      "WAC Value Total Stock": |-
        SUM(Inventory_Fact.wac_value_total_stock)
      "Subledger Business Unit Callout": |-
        MAX(bucallouts.subledger_callout_text)
      "GL Business Unit Callout": |-
        MAX(bucallouts.gl_callout_text)
      "DSI Calculation Callout": |-
        MAX(bucallouts.dsi_calculation_callout_text)
