semantic_model:
  name: "ecommerce_model"
  tables:
    - name: "orders"
      base_table: "prod.public.orders"
      dimensions:
        - name: "order_id"
          expr: "order_id"
          data_type: "number"
        - name: "status"
          expr: "status"
          data_type: "varchar"
      measures:
        - name: "total_orders"
          expr: "COUNT(order_id)"
          description: "Count of all orders"
