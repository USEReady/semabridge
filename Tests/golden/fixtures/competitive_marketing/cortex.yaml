semantic_model:
  name: golden
  node_type: semantic_model
  tables:
    - name: Category
      base_table:
        database: GOLDEN_DB
        schema: GOLDEN_SCHEMA
        table: CATEGORY
      dimensions:
        - name: Category
          expr: Category
          description: ''
          synonyms:
            - Product Category
        - name: Channel
          expr: Channel
          description: ''
        - name: Sort
          expr: Sort
          description: ''
      measures: []
    - name: Date
      base_table:
        database: GOLDEN_DB
        schema: GOLDEN_SCHEMA
        table: DATE
      dimensions:
        - name: Date
          expr: Date
          description: ''
        - name: MonthName
          expr: MonthName
          description: ''
        - name: Month
          expr: Month
          description: ''
        - name: Quarter
          expr: Quarter
          description: ''
        - name: Running Months
          expr: Running Months
          description: ''
        - name: Rolling Period
          expr: Rolling Period
          description: ''
        - name: Months
          expr: Months
          description: ''
      measures:
        - name: SUM_OF_MONTHNO
          description: ''
          expr: SUM(COL_DATE."MONTHNO")
        - name: SUM_OF_YEAR
          description: ''
          expr: SUM(COL_DATE."YEAR")
    - name: Geo
      base_table:
        database: GOLDEN_DB
        schema: GOLDEN_SCHEMA
        table: GEO
      dimensions:
        - name: City
          expr: City
          description: ''
        - name: State
          expr: State
          description: ''
        - name: Region
          expr: Region
          description: ''
          synonyms:
            - Sales Region
        - name: District
          expr: District
          description: ''
      measures: []
    - name: Indicators
      base_table:
        database: GOLDEN_DB
        schema: GOLDEN_SCHEMA
        table: INDICATORS
      dimensions:
        - name: Status
          expr: Status
          description: ''
        - name: Image
          expr: Image
          description: ''
      measures:
        - name: SUM_OF_SORT
          description: ''
          expr: SUM(INDICATORS."SORT")
    - name: KPI
      base_table:
        database: GOLDEN_DB
        schema: GOLDEN_SCHEMA
        table: KPI
      dimensions:
        - name: Category
          expr: Category
          description: ''
      measures: []
    - name: Manufacturer
      base_table:
        database: GOLDEN_DB
        schema: GOLDEN_SCHEMA
        table: MANUFACTURER
      dimensions:
        - name: Manufacturer
          expr: Manufacturer
          description: ''
        - name: MfgisVanArsdel
          expr: MfgisVanArsdel
          description: ''
      measures: []
    - name: Product
      base_table:
        database: GOLDEN_DB
        schema: GOLDEN_SCHEMA
        table: PRODUCT
      dimensions:
        - name: Manufacturer
          expr: Manufacturer
          description: ''
        - name: Category
          expr: Category
          description: ''
        - name: Segment
          expr: Segment
          description: ''
        - name: Product
          expr: Product
          description: ''
        - name: isVanArsdel
          expr: isVanArsdel
          description: ''
          synonyms:
            - Is Our Product
        - name: IsCompete
          expr: IsCompete
          description: ''
          synonyms:
            - Is Competitor Product
      measures:
        - name: Count of Product
          description: ''
          expr: COUNT(PRODUCT."PRODUCT")
        - name: NewCount of Product
          description: '[DAX: COUNTBLANK(''Product''[Product])]'
          expr: 'NULL'
        - name: NewNewCount of Product
          description: '[DAX: COUNTBLANK(''Product''[Product])]'
          expr: 'NULL'
    - name: SalesFact
      base_table:
        database: GOLDEN_DB
        schema: GOLDEN_SCHEMA
        table: SALESFACT
      dimensions: []
      measures:
        - name: KPI01
          description: |-
            Note: This metric's CALCULATE(...) filters by table 'Date', but 'KPI' (this metric's own base table) has no relationship path to 'Date'. Snowflake's semantic-view compiler will reject this as "a metric cannot refer to another dimension from an unrelated entity" (error 010211) regardless of how the DAX is translated — the SQL expression's shape isn't the problem, the missing relationship path is. 'Total Category Volume' (the measure this CALCULATE wraps, declared on 'SalesFact') DOES have a path to 'Date' — this metric may be declared under the wrong table; re-anchoring it to 'SalesFact', or adding a relationship between 'KPI' and 'SalesFact', would resolve this. [DAX: IF(SUM('KPI'[KPI])=1,CONCATENATE(LEFT([Total Units YTD Var %2],3),(" % ROI (Return on Investment)"))...]
          expr: 'NULL'
          synonyms:
            - Total Sales
            - Online Sales
            - Social Media Sales
            - Stores Sales
            - Outlet Sales
        - name: KPI02
          description: |-
            Note: This metric's CALCULATE(...) filters by table 'Date', but 'KPI' (this metric's own base table) has no relationship path to 'Date'. Snowflake's semantic-view compiler will reject this as "a metric cannot refer to another dimension from an unrelated entity" (error 010211) regardless of how the DAX is translated — the SQL expression's shape isn't the problem, the missing relationship path is. 'Total Category Volume' (the measure this CALCULATE wraps, declared on 'SalesFact') DOES have a path to 'Date' — this metric may be declared under the wrong table; re-anchoring it to 'SalesFact', or adding a relationship between 'KPI' and 'SalesFact', would resolve this. [DAX: IF(SUM('KPI'[KPI])=1,(CALCULATE([Total Category Volume],'Date'[Running Year]=1)),IF(SUM('KPI'[KPI])=...]
          expr: 'NULL'
        - name: Total Units
          description: ''
          expr: SUM(SALESFACT."UNITS")
          synonyms:
            - Units Sold
        - name: Sales $
          description: ''
          expr: SUM(SALESFACT."REVENUE")
          synonyms:
            - Total Revenue
        - name: Total Units YTD
          description: |-
            Note: DAX CALCULATE filters override existing filters on that column, while the SUM(CASE WHEN ...) translation doesn't, so results differ when grouping by the filtered column. Time-intelligence window is anchored to the latest date in the data (enriched-view period flag IS_YTD), as DAX does with no date filter; the window does not move with a period chosen in the query.
          expr: SUM(CASE WHEN SALESFACT."IS_YTD" THEN SALESFACT."UNITS" ELSE NULL END)
        - name: Total VanArsdel Units YTD
          description: |-
            Note: DAX CALCULATE filters override existing filters on that column, while the SUM(CASE WHEN ...) translation doesn't, so results differ when grouping by the filtered column. Time-intelligence window is anchored to the latest date in the data (enriched-view period flag IS_YTD), as DAX does with no date filter; the window does not move with a period chosen in the query.
          expr: |-
            SUM(CASE WHEN PRODUCT."ISVANARSDEL" = 'Yes' THEN CASE WHEN SALESFACT."IS_YTD" THEN SALESFACT."UNITS" ELSE NULL END ELSE NULL END)
        - name: Total OTHER Units YTD
          description: |-
            Note: DAX CALCULATE filters override existing filters on that column, while the SUM(CASE WHEN ...) translation doesn't, so results differ when grouping by the filtered column. Time-intelligence window is anchored to the latest date in the data (enriched-view period flag IS_YTD), as DAX does with no date filter; the window does not move with a period chosen in the query.
          expr: |-
            SUM(CASE WHEN PRODUCT."ISVANARSDEL" = 'No' THEN CASE WHEN SALESFACT."IS_YTD" THEN SALESFACT."UNITS" ELSE NULL END ELSE NULL END)
        - name: Total VanArsdel Units
          description: |-
            Note: DAX CALCULATE filters override existing filters on that column, while the SUM(CASE WHEN ...) translation doesn't, so results differ when grouping by the filtered column.
          expr: |-
            SUM(CASE WHEN PRODUCT."ISVANARSDEL" = 'Yes' THEN SALESFACT."UNITS" ELSE NULL END)
          synonyms:
            - Our Brand Units
        - name: Total OTHER Units
          description: |-
            Note: DAX CALCULATE filters override existing filters on that column, while the SUM(CASE WHEN ...) translation doesn't, so results differ when grouping by the filtered column.
          expr: SUM(CASE WHEN PRODUCT."ISVANARSDEL" = 'No' THEN SALESFACT."UNITS" ELSE NULL END)
          synonyms:
            - Competitor Units
        - name: '% Units Market Share'
          description: ''
          expr: |-
            CASE WHEN COALESCE((SUM(CASE WHEN PRODUCT."ISVANARSDEL" = 'Yes' THEN SALESFACT."UNITS" ELSE NULL END)), 0) = 0 THEN 0 ELSE IFF(COALESCE((SUM(SALESFACT."UNITS")), 0) = 0, 0, (SUM(CASE WHEN PRODUCT."ISVANARSDEL" = 'Yes' THEN SALESFACT."UNITS" ELSE NULL END)) / (SUM(SALESFACT."UNITS"))) END
          synonyms:
            - Market Share %
        - name: Total Category Volume
          description: ''
          expr: (SUM(SALESFACT."UNITS"))
          synonyms:
            - Category Volume
        - name: Total Compete Volume
          description: ''
          expr: SUM(CASE WHEN PRODUCT.ISVANARSDEL = 'No' THEN SALESFACT."UNITS" END)
        - name: '% Category Compete Share'
          description: ''
          expr: |-
            FLOOR((SUM(CASE WHEN PRODUCT.ISVANARSDEL = 'No' THEN SALESFACT."UNITS" END)) / NULLIF((SUM(SALESFACT."UNITS")), 0) * 100)
        - name: TOTAL UNITS SPLY
          description: |-
            Note: DAX CALCULATE filters override existing filters on that column, while the SUM(CASE WHEN ...) translation doesn't, so results differ when grouping by the filtered column. Time-intelligence window is anchored to the latest date in the data (enriched-view period flag IS_SPLY_YEAR), as DAX does with no date filter; the window does not move with a period chosen in the query. Grouped by year or month it still returns the latest period's prior-year value, not each row's own prior year: a per-period same-period-last-year is not expressible as a Snowflake semantic-view metric.
          expr: SUM(CASE WHEN SALESFACT."IS_SPLY_YEAR" THEN SALESFACT."UNITS" ELSE NULL END)
        - name: Total Units YTD SPLY
          description: |-
            Note: DAX CALCULATE filters override existing filters on that column, while the SUM(CASE WHEN ...) translation doesn't, so results differ when grouping by the filtered column. Time-intelligence window is anchored to the latest date in the data (enriched-view period flag IS_YTD_SPLY_YEAR), as DAX does with no date filter; the window does not move with a period chosen in the query. Grouped by year or month it still returns the latest period's prior-year value, not each row's own prior year: a per-period same-period-last-year is not expressible as a Snowflake semantic-view metric.
          expr: |-
            (SUM(CASE WHEN SALESFACT."IS_YTD_SPLY_YEAR" THEN SALESFACT."UNITS" ELSE NULL END))
        - name: Total VanArsdel Units YTD SPLY
          description: |-
            Note: DAX CALCULATE filters override existing filters on that column, while the SUM(CASE WHEN ...) translation doesn't, so results differ when grouping by the filtered column. Time-intelligence window is anchored to the latest date in the data (enriched-view period flag IS_YTD_SPLY_YEAR), as DAX does with no date filter; the window does not move with a period chosen in the query. Grouped by year or month it still returns the latest period's prior-year value, not each row's own prior year: a per-period same-period-last-year is not expressible as a Snowflake semantic-view metric.
          expr: |-
            (SUM(CASE WHEN PRODUCT."ISVANARSDEL" = 'Yes' THEN CASE WHEN SALESFACT."IS_YTD_SPLY_YEAR" THEN SALESFACT."UNITS" ELSE NULL END ELSE NULL END))
        - name: Total OTHER Units YTD SPLY
          description: |-
            Note: DAX CALCULATE filters override existing filters on that column, while the SUM(CASE WHEN ...) translation doesn't, so results differ when grouping by the filtered column. Time-intelligence window is anchored to the latest date in the data (enriched-view period flag IS_YTD_SPLY_YEAR), as DAX does with no date filter; the window does not move with a period chosen in the query. Grouped by year or month it still returns the latest period's prior-year value, not each row's own prior year: a per-period same-period-last-year is not expressible as a Snowflake semantic-view metric.
          expr: |-
            (SUM(CASE WHEN PRODUCT."ISVANARSDEL" = 'No' THEN CASE WHEN SALESFACT."IS_YTD_SPLY_YEAR" THEN SALESFACT."UNITS" ELSE NULL END ELSE NULL END))
        - name: '% Units Market Share YTD'
          description: |-
            Note: Time-intelligence window is anchored to the latest date in the data (enriched-view period flag IS_YTD), as DAX does with no date filter; the window does not move with a period chosen in the query.
          expr: |-
            (SUM(CASE WHEN PRODUCT."ISVANARSDEL" = 'Yes' THEN CASE WHEN SALESFACT."IS_YTD" THEN SALESFACT."UNITS" ELSE NULL END ELSE NULL END)) / NULLIF((SUM(CASE WHEN SALESFACT."IS_YTD" THEN SALESFACT."UNITS" ELSE NULL END)), 0)
        - name: '% Market Share SPLY YTD'
          description: |-
            Note: DAX CALCULATE filters override existing filters on that column, while the SUM(CASE WHEN ...) translation doesn't, so results differ when grouping by the filtered column. Time-intelligence window is anchored to the latest date in the data (enriched-view period flag IS_YTD_SPLY_YEAR), as DAX does with no date filter; the window does not move with a period chosen in the query. Grouped by year or month it still returns the latest period's prior-year value, not each row's own prior year: a per-period same-period-last-year is not expressible as a Snowflake semantic-view metric.
          expr: |-
            ((SUM(CASE WHEN PRODUCT."ISVANARSDEL" = 'Yes' THEN CASE WHEN SALESFACT."IS_YTD_SPLY_YEAR" THEN SALESFACT."UNITS" ELSE NULL END ELSE NULL END)) / NULLIF((SUM(CASE WHEN SALESFACT."IS_YTD_SPLY_YEAR" THEN SALESFACT."UNITS" ELSE NULL END)), 0))
        - name: '% Unit Market Share YOY Change'
          description: |-
            Note: Time-intelligence window is anchored to CURRENT_DATE() because no data-anchored period flag was available; DAX anchors to the last date in the filter context, so values differ when the data does not extend to today.
          expr: |-
            CASE WHEN (CASE WHEN COALESCE((SUM(CASE WHEN PRODUCT."ISVANARSDEL" = 'Yes' THEN SALESFACT."UNITS" ELSE NULL END)), 0) = 0 THEN 0 ELSE IFF(COALESCE((SUM(SALESFACT."UNITS")), 0) = 0, 0, (SUM(CASE WHEN PRODUCT."ISVANARSDEL" = 'Yes' THEN SALESFACT."UNITS" ELSE NULL END)) / (SUM(SALESFACT."UNITS"))) END) IS NULL AND (CASE WHEN COALESCE((SUM(CASE WHEN YEAR(COL_DATE."COL_DATE") = YEAR(DATEADD(YEAR, -1, CURRENT_DATE())) AND COL_DATE."COL_DATE" BETWEEN DATEADD(YEAR, -1, DATE_TRUNC('YEAR', CURRENT_DATE())) AND DATEADD(YEAR, -1, CURRENT_DATE()) THEN CASE WHEN PRODUCT."ISVANARSDEL" = 'Yes' THEN SALESFACT."UNITS" ELSE NULL END ELSE NULL END)), 0) = 0 THEN 0 ELSE IFF(COALESCE((SUM(CASE WHEN YEAR(COL_DATE."COL_DATE") = YEAR(DATEADD(YEAR, -1, CURRENT_DATE())) AND COL_DATE."COL_DATE" BETWEEN DATEADD(YEAR, -1, DATE_TRUNC('YEAR', CURRENT_DATE())) AND DATEADD(YEAR, -1, CURRENT_DATE()) THEN SALESFACT."UNITS" ELSE NULL END)), 0) = 0, 0, (SUM(CASE WHEN YEAR(COL_DATE."COL_DATE") = YEAR(DATEADD(YEAR, -1, CURRENT_DATE())) AND COL_DATE."COL_DATE" BETWEEN DATEADD(YEAR, -1, DATE_TRUNC('YEAR', CURRENT_DATE())) AND DATEADD(YEAR, -1, CURRENT_DATE()) THEN CASE WHEN PRODUCT."ISVANARSDEL" = 'Yes' THEN SALESFACT."UNITS" ELSE NULL END ELSE NULL END)) / (SUM(CASE WHEN YEAR(COL_DATE."COL_DATE") = YEAR(DATEADD(YEAR, -1, CURRENT_DATE())) AND COL_DATE."COL_DATE" BETWEEN DATEADD(YEAR, -1, DATE_TRUNC('YEAR', CURRENT_DATE())) AND DATEADD(YEAR, -1, CURRENT_DATE()) THEN SALESFACT."UNITS" ELSE NULL END))) END) IS NULL THEN NULL ELSE COALESCE((CASE WHEN COALESCE((SUM(CASE WHEN PRODUCT."ISVANARSDEL" = 'Yes' THEN SALESFACT."UNITS" ELSE NULL END)), 0) = 0 THEN 0 ELSE IFF(COALESCE((SUM(SALESFACT."UNITS")), 0) = 0, 0, (SUM(CASE WHEN PRODUCT."ISVANARSDEL" = 'Yes' THEN SALESFACT."UNITS" ELSE NULL END)) / (SUM(SALESFACT."UNITS"))) END), 0) - COALESCE((CASE WHEN COALESCE((SUM(CASE WHEN YEAR(COL_DATE."COL_DATE") = YEAR(DATEADD(YEAR, -1, CURRENT_DATE())) AND COL_DATE."COL_DATE" BETWEEN DATEADD(YEAR, -1, DATE_TRUNC('YEAR', CURRENT_DATE())) AND DATEADD(YEAR, -1, CURRENT_DATE()) THEN CASE WHEN PRODUCT."ISVANARSDEL" = 'Yes' THEN SALESFACT."UNITS" ELSE NULL END ELSE NULL END)), 0) = 0 THEN 0 ELSE IFF(COALESCE((SUM(CASE WHEN YEAR(COL_DATE."COL_DATE") = YEAR(DATEADD(YEAR, -1, CURRENT_DATE())) AND COL_DATE."COL_DATE" BETWEEN DATEADD(YEAR, -1, DATE_TRUNC('YEAR', CURRENT_DATE())) AND DATEADD(YEAR, -1, CURRENT_DATE()) THEN SALESFACT."UNITS" ELSE NULL END)), 0) = 0, 0, (SUM(CASE WHEN YEAR(COL_DATE."COL_DATE") = YEAR(DATEADD(YEAR, -1, CURRENT_DATE())) AND COL_DATE."COL_DATE" BETWEEN DATEADD(YEAR, -1, DATE_TRUNC('YEAR', CURRENT_DATE())) AND DATEADD(YEAR, -1, CURRENT_DATE()) THEN CASE WHEN PRODUCT."ISVANARSDEL" = 'Yes' THEN SALESFACT."UNITS" ELSE NULL END ELSE NULL END)) / (SUM(CASE WHEN YEAR(COL_DATE."COL_DATE") = YEAR(DATEADD(YEAR, -1, CURRENT_DATE())) AND COL_DATE."COL_DATE" BETWEEN DATEADD(YEAR, -1, DATE_TRUNC('YEAR', CURRENT_DATE())) AND DATEADD(YEAR, -1, CURRENT_DATE()) THEN SALESFACT."UNITS" ELSE NULL END))) END), 0) END
        - name: '% Units Market Share SPLY'
          description: |-
            Note: DAX CALCULATE filters override existing filters on that column, while the SUM(CASE WHEN ...) translation doesn't, so results differ when grouping by the filtered column. Time-intelligence window is anchored to the latest date in the data (enriched-view period flag IS_SPLY_YEAR), as DAX does with no date filter; the window does not move with a period chosen in the query. Grouped by year or month it still returns the latest period's prior-year value, not each row's own prior year: a per-period same-period-last-year is not expressible as a Snowflake semantic-view metric.
          expr: |-
            CASE WHEN COALESCE((SUM(CASE WHEN SALESFACT."IS_SPLY_YEAR" THEN CASE WHEN PRODUCT."ISVANARSDEL" = 'Yes' THEN SALESFACT."UNITS" ELSE NULL END ELSE NULL END)), 0) = 0 THEN 0 ELSE IFF(COALESCE((SUM(CASE WHEN SALESFACT."IS_SPLY_YEAR" THEN SALESFACT."UNITS" ELSE NULL END)), 0) = 0, 0, (SUM(CASE WHEN SALESFACT."IS_SPLY_YEAR" THEN CASE WHEN PRODUCT."ISVANARSDEL" = 'Yes' THEN SALESFACT."UNITS" ELSE NULL END ELSE NULL END)) / (SUM(CASE WHEN SALESFACT."IS_SPLY_YEAR" THEN SALESFACT."UNITS" ELSE NULL END))) END
        - name: Total Units R12Ms
          description: |-
            Note: DAX CALCULATE filters override existing filters on that column, while the SUM(CASE WHEN ...) translation doesn't, so results differ when grouping by the filtered column. Time-intelligence window is anchored to the latest date in the data (enriched-view period flag IS_R12M), as DAX does with no date filter; the window does not move with a period chosen in the query.
          expr: SUM(CASE WHEN SALESFACT."IS_R12M" THEN SALESFACT."UNITS"::FLOAT END)
        - name: Total VanArsdel Units R12M
          description: |-
            Note: DAX CALCULATE filters override existing filters on that column, while the SUM(CASE WHEN ...) translation doesn't, so results differ when grouping by the filtered column. Time-intelligence window is anchored to the latest date in the data (enriched-view period flag IS_R12M), as DAX does with no date filter; the window does not move with a period chosen in the query.
          expr: |-
            SUM(CASE WHEN PRODUCT."ISVANARSDEL" = 'Yes' THEN CASE WHEN SALESFACT."IS_R12M" THEN SALESFACT."UNITS"::FLOAT END ELSE NULL END)
        - name: Total OTHER Units R12M
          description: |-
            Note: DAX CALCULATE filters override existing filters on that column, while the SUM(CASE WHEN ...) translation doesn't, so results differ when grouping by the filtered column. Time-intelligence window is anchored to the latest date in the data (enriched-view period flag IS_R12M), as DAX does with no date filter; the window does not move with a period chosen in the query.
          expr: |-
            SUM(CASE WHEN PRODUCT."ISVANARSDEL" = 'No' THEN CASE WHEN SALESFACT."IS_R12M" THEN SALESFACT."UNITS"::FLOAT END ELSE NULL END)
        - name: '% Units Market Share R12M'
          description: |-
            Note: Time-intelligence window is anchored to the latest date in the data (enriched-view period flag IS_R12M), as DAX does with no date filter; the window does not move with a period chosen in the query.
          expr: |-
            CASE WHEN COALESCE((SUM(CASE WHEN PRODUCT."ISVANARSDEL" = 'Yes' THEN CASE WHEN SALESFACT."IS_R12M" THEN SALESFACT."UNITS"::FLOAT END ELSE NULL END)), 0) = 0 THEN 0 ELSE IFF(COALESCE((SUM(CASE WHEN SALESFACT."IS_R12M" THEN SALESFACT."UNITS"::FLOAT END)), 0) = 0, 0, (SUM(CASE WHEN PRODUCT."ISVANARSDEL" = 'Yes' THEN CASE WHEN SALESFACT."IS_R12M" THEN SALESFACT."UNITS"::FLOAT END ELSE NULL END)) / (SUM(CASE WHEN SALESFACT."IS_R12M" THEN SALESFACT."UNITS"::FLOAT END))) END
        - name: Total Units YTD Var
          description: |-
            Note: Time-intelligence window is anchored to the latest date in the data (enriched-view period flag IS_YTD, IS_YTD_SPLY_YEAR), as DAX does with no date filter; the window does not move with a period chosen in the query. Grouped by year or month it still returns the latest period's prior-year value, not each row's own prior year: a per-period same-period-last-year is not expressible as a Snowflake semantic-view metric.
          expr: |-
            CASE WHEN (SUM(CASE WHEN SALESFACT."IS_YTD" THEN SALESFACT."UNITS" ELSE NULL END)) IS NULL AND (SUM(CASE WHEN SALESFACT."IS_YTD_SPLY_YEAR" THEN SALESFACT."UNITS" ELSE NULL END)) IS NULL THEN NULL ELSE COALESCE((SUM(CASE WHEN SALESFACT."IS_YTD" THEN SALESFACT."UNITS" ELSE NULL END)), 0) - COALESCE((SUM(CASE WHEN SALESFACT."IS_YTD_SPLY_YEAR" THEN SALESFACT."UNITS" ELSE NULL END)), 0) END
        - name: Total Units YTD Var %
          description: |-
            Note: Time-intelligence window is anchored to the latest date in the data (enriched-view period flag IS_SPLY_YEAR, IS_YTD, IS_YTD_SPLY_YEAR), as DAX does with no date filter; the window does not move with a period chosen in the query. Grouped by year or month it still returns the latest period's prior-year value, not each row's own prior year: a per-period same-period-last-year is not expressible as a Snowflake semantic-view metric.
          expr: |-
            (CASE WHEN (SUM(CASE WHEN SALESFACT."IS_YTD" THEN SALESFACT."UNITS" ELSE NULL END)) IS NULL AND (SUM(CASE WHEN SALESFACT."IS_YTD_SPLY_YEAR" THEN SALESFACT."UNITS" ELSE NULL END)) IS NULL THEN NULL ELSE COALESCE((SUM(CASE WHEN SALESFACT."IS_YTD" THEN SALESFACT."UNITS" ELSE NULL END)), 0) - COALESCE((SUM(CASE WHEN SALESFACT."IS_YTD_SPLY_YEAR" THEN SALESFACT."UNITS" ELSE NULL END)), 0) END) / NULLIF((SUM(CASE WHEN SALESFACT."IS_SPLY_YEAR" THEN SALESFACT."UNITS" ELSE NULL END)), 0)
        - name: Sum of Units
          description: ''
          expr: SUM(SALESFACT."UNITS")
        - name: Sum of Revenue
          description: ''
          expr: SUM(SALESFACT."REVENUE")
        - name: '@Indicator01'
          description: |-
            Note: Time-intelligence window is anchored to CURRENT_DATE() because no data-anchored period flag was available; DAX anchors to the last date in the filter context, so values differ when the data does not extend to today.
          expr: |-
            CASE WHEN COALESCE((FLOOR((SUM(CASE WHEN PRODUCT.ISVANARSDEL = 'No' THEN SALESFACT."UNITS" END)) / NULLIF((SUM(SALESFACT."UNITS")), 0) * 100)), 0) < 0.55 THEN 1 ELSE CASE WHEN (FLOOR((SUM(CASE WHEN PRODUCT.ISVANARSDEL = 'No' THEN SALESFACT."UNITS" END)) / NULLIF((SUM(SALESFACT."UNITS")), 0) * 100)) > 0.6 THEN 3 ELSE 2 END END
        - name: '@Indicator02'
          description: |-
