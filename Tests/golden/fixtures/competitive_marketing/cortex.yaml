        - name: Total Units YTD Var %2
          description: |-
            Note: Time-intelligence window is anchored to the latest date in the data (enriched-view period flag IS_SPLY_YEAR, IS_YTD, IS_YTD_SPLY_YEAR), as DAX does with no date filter; the window does not move with a period chosen in the query. Grouped by year or month it still returns the latest period's prior-year value, not each row's own prior year: a per-period same-period-last-year is not expressible as a Snowflake semantic-view metric.
          expr: |-
            FLOOR((CASE WHEN (SUM(CASE WHEN SALESFACT."IS_YTD" THEN SALESFACT."UNITS" ELSE NULL END)) IS NULL AND (SUM(CASE WHEN SALESFACT."IS_YTD_SPLY_YEAR" THEN SALESFACT."UNITS" ELSE NULL END)) IS NULL THEN NULL ELSE COALESCE((SUM(CASE WHEN SALESFACT."IS_YTD" THEN SALESFACT."UNITS" ELSE NULL END)), 0) - COALESCE((SUM(CASE WHEN SALESFACT."IS_YTD_SPLY_YEAR" THEN SALESFACT."UNITS" ELSE NULL END)), 0) END) / NULLIF((SUM(CASE WHEN SALESFACT."IS_SPLY_YEAR" THEN SALESFACT."UNITS" ELSE NULL END)), 0) * 100)
    - name: Sentiment
      base_table:
        database: GOLDEN_DB
        schema: GOLDEN_SCHEMA
        table: SENTIMENT
      dimensions: []
      measures:
        - name: Sentiment
          description: ''
          expr: AVG(SENTIMENT."SCORE")
          synonyms:
            - Brand Sentiment Score
        - name: Sentiment Gap
          description: |-
            Note: Time-intelligence window is anchored to CURRENT_DATE() because no data-anchored period flag was available; DAX anchors to the last date in the filter context, so values differ when the data does not extend to today. DAX CALCULATE filters override existing filters on that column, while the SUM(CASE WHEN ...) translation doesn't, so results differ when grouping by the filtered column.
          expr: |-
            CASE WHEN NOT COALESCE((((AVG(CASE WHEN MANUFACTURER."MFGISVANARSDEL" = 'No' THEN SENTIMENT."SCORE" ELSE NULL END) IS NULL)) OR ((AVG(CASE WHEN MANUFACTURER."MFGISVANARSDEL" = 'Yes' THEN SENTIMENT."SCORE" ELSE NULL END) IS NULL))), FALSE) THEN CASE WHEN (AVG(CASE WHEN MANUFACTURER."MFGISVANARSDEL" = 'No' THEN SENTIMENT."SCORE" ELSE NULL END)) IS NULL AND (AVG(CASE WHEN MANUFACTURER."MFGISVANARSDEL" = 'Yes' THEN SENTIMENT."SCORE" ELSE NULL END)) IS NULL THEN NULL ELSE COALESCE(AVG(CASE WHEN MANUFACTURER."MFGISVANARSDEL" = 'No' THEN SENTIMENT."SCORE" ELSE NULL END), 0) - COALESCE(AVG(CASE WHEN MANUFACTURER."MFGISVANARSDEL" = 'Yes' THEN SENTIMENT."SCORE" ELSE NULL END), 0) END END
          synonyms:
            - Sentiment Advantage
        - name: '@Indicator04'
          description: |-
            Note: Time-intelligence window is anchored to CURRENT_DATE() because no data-anchored period flag was available; DAX anchors to the last date in the filter context, so values differ when the data does not extend to today.
          expr: |-
            CASE WHEN COALESCE((AVG(SENTIMENT."SCORE")), 0) < 65 THEN 1 ELSE CASE WHEN (AVG(SENTIMENT."SCORE")) > 67 THEN 3 ELSE 2 END END
        - name: '@Indicator05'
          description: |-
            Note: Time-intelligence window is anchored to CURRENT_DATE() because no data-anchored period flag was available; DAX anchors to the last date in the filter context, so values differ when the data does not extend to today.
          expr: |-
            CASE WHEN COALESCE((CASE WHEN NOT COALESCE((((AVG(CASE WHEN MANUFACTURER."MFGISVANARSDEL" = 'No' THEN SENTIMENT."SCORE" ELSE NULL END) IS NULL)) OR ((AVG(CASE WHEN MANUFACTURER."MFGISVANARSDEL" = 'Yes' THEN SENTIMENT."SCORE" ELSE NULL END) IS NULL))), FALSE) THEN CASE WHEN (AVG(CASE WHEN MANUFACTURER."MFGISVANARSDEL" = 'No' THEN SENTIMENT."SCORE" ELSE NULL END)) IS NULL AND (AVG(CASE WHEN MANUFACTURER."MFGISVANARSDEL" = 'Yes' THEN SENTIMENT."SCORE" ELSE NULL END)) IS NULL THEN NULL ELSE COALESCE(AVG(CASE WHEN MANUFACTURER."MFGISVANARSDEL" = 'No' THEN SENTIMENT."SCORE" ELSE NULL END), 0) - COALESCE(AVG(CASE WHEN MANUFACTURER."MFGISVANARSDEL" = 'Yes' THEN SENTIMENT."SCORE" ELSE NULL END), 0) END END), 0) < 15 THEN 1 ELSE CASE WHEN (CASE WHEN NOT COALESCE((((AVG(CASE WHEN MANUFACTURER."MFGISVANARSDEL" = 'No' THEN SENTIMENT."SCORE" ELSE NULL END) IS NULL)) OR ((AVG(CASE WHEN MANUFACTURER."MFGISVANARSDEL" = 'Yes' THEN SENTIMENT."SCORE" ELSE NULL END) IS NULL))), FALSE) THEN CASE WHEN (AVG(CASE WHEN MANUFACTURER."MFGISVANARSDEL" = 'No' THEN SENTIMENT."SCORE" ELSE NULL END)) IS NULL AND (AVG(CASE WHEN MANUFACTURER."MFGISVANARSDEL" = 'Yes' THEN SENTIMENT."SCORE" ELSE NULL END)) IS NULL THEN NULL ELSE COALESCE(AVG(CASE WHEN MANUFACTURER."MFGISVANARSDEL" = 'No' THEN SENTIMENT."SCORE" ELSE NULL END), 0) - COALESCE(AVG(CASE WHEN MANUFACTURER."MFGISVANARSDEL" = 'Yes' THEN SENTIMENT."SCORE" ELSE NULL END), 0) END END) > 25 THEN 3 ELSE 2 END END
