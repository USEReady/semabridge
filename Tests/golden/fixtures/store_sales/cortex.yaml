semantic_model:
  name: golden
  node_type: semantic_model
  tables:
    - name: District
      base_table:
        database: GOLDEN_DB
        schema: GOLDEN_SCHEMA
        table: DISTRICT
      dimensions:
        - name: DistrictID
          expr: DistrictID
          description: ''
        - name: District
          expr: District
          description: ''
        - name: DM
          expr: DM
          description: ''
        - name: DM_Pic_fl
          expr: DM_Pic_fl
          description: ''
        - name: DM_Pic
          expr: DM_Pic
          description: ''
        - name: BusinessUnitID
          expr: BusinessUnitID
          description: ''
        - name: DMImage
          expr: DMImage
          description: ''
      measures: []
    - name: Item
      base_table:
        database: GOLDEN_DB
        schema: GOLDEN_SCHEMA
        table: ITEM
      dimensions:
        - name: Segment
          expr: Segment
          description: ''
        - name: Category
          expr: Category
          description: ''
        - name: Buyer
          expr: Buyer
          description: ''
        - name: FamilyNane
          expr: FamilyNane
          description: ''
        - name: Category (clusters) 2
          expr: Category (clusters) 2
          description: ''
      measures: []
    - name: Sales
      base_table:
        database: GOLDEN_DB
        schema: GOLDEN_SCHEMA
        table: SALES
      dimensions: []
      measures:
        - name: Test Measure
          description: |-
            Note: DAX CALCULATE filters override existing filters on that column, while the SUM(CASE WHEN ...) translation doesn't, so results differ when grouping by the filtered column.
          expr: SUM(SALES."SUM_REGULAR_SALES_UNITS"::FLOAT) * 2
        - name: Regular_Sales_Dollars
          description: ''
          expr: SUM(SALES."SUM_REGULAR_SALES_DOLLARS")
        - name: Markdown_Sales_Dollars
          description: ''
          expr: SUM(SALES."SUM_MARKDOWN_SALES_DOLLARS")
        - name: TotalSales
          description: ''
          expr: |-
            CASE WHEN (SUM(SALES."SUM_REGULAR_SALES_DOLLARS")) IS NULL AND (SUM(SALES."SUM_MARKDOWN_SALES_DOLLARS")) IS NULL THEN NULL ELSE COALESCE((SUM(SALES."SUM_REGULAR_SALES_DOLLARS")), 0) + COALESCE((SUM(SALES."SUM_MARKDOWN_SALES_DOLLARS")), 0) END
        - name: TotalSalesLY
          description: |-
            Note: DAX CALCULATE filters override existing filters on that column, while the SUM(CASE WHEN ...) translation doesn't, so results differ when grouping by the filtered column.
          expr: |-
            CASE WHEN (SUM(CASE WHEN SALES."SCENARIOID" = 2 THEN SALES."SUM_REGULAR_SALES_DOLLARS" ELSE NULL END)) IS NULL AND (SUM(CASE WHEN SALES."SCENARIOID" = 2 THEN SALES."SUM_MARKDOWN_SALES_DOLLARS" ELSE NULL END)) IS NULL THEN NULL ELSE COALESCE((SUM(CASE WHEN SALES."SCENARIOID" = 2 THEN SALES."SUM_REGULAR_SALES_DOLLARS" ELSE NULL END)), 0) + COALESCE((SUM(CASE WHEN SALES."SCENARIOID" = 2 THEN SALES."SUM_MARKDOWN_SALES_DOLLARS" ELSE NULL END)), 0) END
        - name: Gross Margin This Year
          description: |-
            Note: DAX CALCULATE filters override existing filters on that column, while the SUM(CASE WHEN ...) translation doesn't, so results differ when grouping by the filtered column.
          expr: SUM(CASE WHEN SALES.SCENARIOID = 1 THEN SALES."SUM_GROSSMARGINAMOUNT" END)
        - name: Gross Margin This Year %
          description: ''
          expr: |-
            (SUM(CASE WHEN SALES.SCENARIOID = 1 THEN SALES."SUM_GROSSMARGINAMOUNT" END)) / NULLIF(CASE WHEN (SUM(CASE WHEN SALES."SCENARIOID" = 1 THEN SALES."SUM_REGULAR_SALES_DOLLARS" ELSE NULL END)) IS NULL AND (SUM(CASE WHEN SALES."SCENARIOID" = 1 THEN SALES."SUM_MARKDOWN_SALES_DOLLARS" ELSE NULL END)) IS NULL THEN NULL ELSE COALESCE((SUM(CASE WHEN SALES."SCENARIOID" = 1 THEN SALES."SUM_REGULAR_SALES_DOLLARS" ELSE NULL END)), 0) + COALESCE((SUM(CASE WHEN SALES."SCENARIOID" = 1 THEN SALES."SUM_MARKDOWN_SALES_DOLLARS" ELSE NULL END)), 0) END, 0)
        - name: Gross Margin Last Year
          description: |-
            Note: DAX CALCULATE filters override existing filters on that column, while the SUM(CASE WHEN ...) translation doesn't, so results differ when grouping by the filtered column.
          expr: SUM(CASE WHEN SALES.SCENARIOID = 2 THEN SALES."SUM_GROSSMARGINAMOUNT" END)
        - name: Gross Margin Last Year %
          description: ''
          expr: |-
            (SUM(CASE WHEN SALES.SCENARIOID = 2 THEN SALES."SUM_GROSSMARGINAMOUNT" END)) / NULLIF(CASE WHEN (SUM(CASE WHEN SALES."SCENARIOID" = 2 THEN SALES."SUM_REGULAR_SALES_DOLLARS" ELSE NULL END)) IS NULL AND (SUM(CASE WHEN SALES."SCENARIOID" = 2 THEN SALES."SUM_MARKDOWN_SALES_DOLLARS" ELSE NULL END)) IS NULL THEN NULL ELSE COALESCE((SUM(CASE WHEN SALES."SCENARIOID" = 2 THEN SALES."SUM_REGULAR_SALES_DOLLARS" ELSE NULL END)), 0) + COALESCE((SUM(CASE WHEN SALES."SCENARIOID" = 2 THEN SALES."SUM_MARKDOWN_SALES_DOLLARS" ELSE NULL END)), 0) END, 0)
        - name: Regular_Sales_Units
          description: ''
          expr: SUM(SALES."SUM_REGULAR_SALES_UNITS")
        - name: Markdown_Sales_Units
          description: ''
          expr: SUM(SALES."SUM_MARKDOWN_SALES_UNITS")
        - name: TotalUnits
          description: ''
          expr: |-
            CASE WHEN (SUM(SALES."SUM_REGULAR_SALES_UNITS")) IS NULL AND (SUM(SALES."SUM_MARKDOWN_SALES_UNITS")) IS NULL THEN NULL ELSE COALESCE((SUM(SALES."SUM_REGULAR_SALES_UNITS")), 0) + COALESCE((SUM(SALES."SUM_MARKDOWN_SALES_UNITS")), 0) END
        - name: Total Units Last Year
          description: |-
            Note: DAX CALCULATE filters override existing filters on that column, while the SUM(CASE WHEN ...) translation doesn't, so results differ when grouping by the filtered column.
          expr: |-
            CASE WHEN (SUM(CASE WHEN SALES."SCENARIOID" = 2 THEN SALES."SUM_REGULAR_SALES_UNITS" ELSE NULL END)) IS NULL AND (SUM(CASE WHEN SALES."SCENARIOID" = 2 THEN SALES."SUM_MARKDOWN_SALES_UNITS" ELSE NULL END)) IS NULL THEN NULL ELSE COALESCE((SUM(CASE WHEN SALES."SCENARIOID" = 2 THEN SALES."SUM_REGULAR_SALES_UNITS" ELSE NULL END)), 0) + COALESCE((SUM(CASE WHEN SALES."SCENARIOID" = 2 THEN SALES."SUM_MARKDOWN_SALES_UNITS" ELSE NULL END)), 0) END
