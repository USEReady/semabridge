  label: SLA Compliance
  description: Ratio / rate of Is SLA Violation for SLA Compliance (from Artificial
    Intelligence Sample).
  sql_expression: IFF(COALESCE(Cases."CASE_COUNT", 0) = 0, 0, COUNT(CASE WHEN COALESCE(Cases."IS_SLA_VIOLATION",
    FALSE) = FALSE THEN 1 END) / Cases."CASE_COUNT")
  dax_expression: DIVIDE(CALCULATE(COUNTROWS('Cases'),'Cases'[Is SLA Violation] =
