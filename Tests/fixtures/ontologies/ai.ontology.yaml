- name: Cases MoM%
  logical_name: CASES_MOMPCT
  label: Cases MoM%
  description: Ratio / rate of Case Count for Cases Mo M% (from Artificial Intelligence
    Sample).
  sql_expression: (CASE WHEN (Cases."CASE_COUNT") IS NULL AND ("PREV_MONTH") IS NULL
    THEN NULL ELSE COALESCE(Cases."CASE_COUNT", 0) - COALESCE("PREV_MONTH", 0) END)
    / NULLIF("PREV_MONTH", 0)
  dax_expression: "\nVAR __PREV_MONTH = CALCULATE([Case Count], DATEADD('Case Calendar'[Date],\
    \ -1, MONTH))\nRETURN\n\tDIVIDE([Case Count] - __PREV_MONTH, __PREV_MONTH)"
  format_string: 0.0%;-0.0%;0.0%
