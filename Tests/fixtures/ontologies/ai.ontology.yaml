- name: Escalations
  logical_name: ESCALATIONS
  label: Escalations
  description: Ratio / rate of Is Escalated for Escalations (from Artificial Intelligence
    Sample).
  sql_expression: IFF(COALESCE(Cases."CASE_COUNT", 0) = 0, 0, COUNT(CASE WHEN Cases."IS_ESCALATED"
    = TRUE THEN 1 END) / Cases."CASE_COUNT")
  dax_expression: DIVIDE(CALCULATE(COUNTROWS('Cases'),'Cases'[Is Escalated] = TRUE())
    , [Case Count],0)
  format_string: '#,0%;-#,0%;#,0%'
