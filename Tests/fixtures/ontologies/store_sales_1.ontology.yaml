- name: AVG_DOL_UNIT_TY
  logical_name: AVG_DOL_UNIT_TY
  label: Avg Dol Unit Ty
  sql_expression: CASE WHEN (CASE WHEN ((SUM(CASE WHEN SALES."SCENARIOID" = 1 THEN
    SALES."SUM_REGULAR_SALES_UNITS" ELSE NULL END))) IS NULL AND ((SUM(CASE WHEN SALES."SCENARIOID"
    = 1 THEN SALES."SUM_MARKDOWN_SALES_UNITS" ELSE NULL END))) IS NULL THEN NULL ELSE
    COALESCE((SUM(CASE WHEN SALES."SCENARIOID" = 1 THEN SALES."SUM_REGULAR_SALES_UNITS"
    ELSE NULL END)), 0) + COALESCE((SUM(CASE WHEN SALES."SCENARIOID" = 1 THEN SALES."SUM_MARKDOWN_SALES_UNITS"
    ELSE NULL END)), 0) END) <> 0 THEN (CASE WHEN ((SUM(CASE WHEN SALES."SCENARIOID"
    = 1 THEN SALES."SUM_REGULAR_SALES_DOLLARS" ELSE NULL END))) IS NULL AND ((SUM(CASE
    WHEN SALES."SCENARIOID" = 1 THEN SALES."SUM_MARKDOWN_SALES_DOLLARS" ELSE NULL
    END))) IS NULL THEN NULL ELSE COALESCE((SUM(CASE WHEN SALES."SCENARIOID" = 1 THEN
    SALES."SUM_REGULAR_SALES_DOLLARS" ELSE NULL END)), 0) + COALESCE((SUM(CASE WHEN
    SALES."SCENARIOID" = 1 THEN SALES."SUM_MARKDOWN_SALES_DOLLARS" ELSE NULL END)),
    0) END) / NULLIF(CASE WHEN ((SUM(CASE WHEN SALES."SCENARIOID" = 1 THEN SALES."SUM_REGULAR_SALES_UNITS"
    ELSE NULL END))) IS NULL AND ((SUM(CASE WHEN SALES."SCENARIOID" = 1 THEN SALES."SUM_MARKDOWN_SALES_UNITS"
    ELSE NULL END))) IS NULL THEN NULL ELSE COALESCE((SUM(CASE WHEN SALES."SCENARIOID"
    = 1 THEN SALES."SUM_REGULAR_SALES_UNITS" ELSE NULL END)), 0) + COALESCE((SUM(CASE
    WHEN SALES."SCENARIOID" = 1 THEN SALES."SUM_MARKDOWN_SALES_UNITS" ELSE NULL END)),
    0) END, 0) ELSE NULL END
  dax_expression: IF([TOTAL_UNITS_THIS_YEAR]<>0, [TOTALSALESTY]/[TOTAL_UNITS_THIS_YEAR],
    BLANK())
  aggregation_type: NONE
  grain: []
  synonyms:
  - AVG_DOL_UNIT_TY
