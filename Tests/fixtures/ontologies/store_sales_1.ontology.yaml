- name: TOTALSALESLY
  logical_name: TOTALSALESLY
  label: Totalsalesly
  sql_expression: CASE WHEN ((SUM(CASE WHEN SALES."SCENARIOID" = 2 THEN SALES."SUM_REGULAR_SALES_DOLLARS"
    ELSE NULL END))) IS NULL AND ((SUM(CASE WHEN SALES."SCENARIOID" = 2 THEN SALES."SUM_MARKDOWN_SALES_DOLLARS"
    ELSE NULL END))) IS NULL THEN NULL ELSE COALESCE((SUM(CASE WHEN SALES."SCENARIOID"
    = 2 THEN SALES."SUM_REGULAR_SALES_DOLLARS" ELSE NULL END)), 0) + COALESCE((SUM(CASE
    WHEN SALES."SCENARIOID" = 2 THEN SALES."SUM_MARKDOWN_SALES_DOLLARS" ELSE NULL
    END)), 0) END
  dax_expression: CALCULATE([TOTALSALES], Sales[ScenarioID]=2)
