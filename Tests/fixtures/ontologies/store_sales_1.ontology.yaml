- name: TOTALSALES
  logical_name: TOTALSALES
  label: Totalsales
  sql_expression: CASE WHEN ((SUM(SALES."SUM_REGULAR_SALES_DOLLARS"))) IS NULL AND
    ((SUM(SALES."SUM_MARKDOWN_SALES_DOLLARS"))) IS NULL THEN NULL ELSE COALESCE((SUM(SALES."SUM_REGULAR_SALES_DOLLARS")),
    0) + COALESCE((SUM(SALES."SUM_MARKDOWN_SALES_DOLLARS")), 0) END
  dax_expression: '[REGULAR_SALES_DOLLARS]+[MARKDOWN_SALES_DOLLARS]'
  aggregation_type: NONE
