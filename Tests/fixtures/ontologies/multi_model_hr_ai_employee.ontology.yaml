- name: Rev Goal
  logical_name: REV_GOAL
  label: Rev Goal
  sql_expression: CASE WHEN (ROUND((CASE WHEN (Owners."REVENUE_WON") IS NULL AND ((SUM(CASE
    WHEN (OPPORTUNITIES."STATUS" = 'Open') AND (TRY_TO_NUMBER(LEFT(OPPORTUNITIES."PIPELINESTEP",
    1)) >= 3) THEN OPPORTUNITIES."COL_VALUE" END::FLOAT)) * 0.75) IS NULL THEN NULL
    ELSE COALESCE(Owners."REVENUE_WON", 0) + COALESCE((SUM(CASE WHEN (OPPORTUNITIES."STATUS"
    = 'Open') AND (TRY_TO_NUMBER(LEFT(OPPORTUNITIES."PIPELINESTEP", 1)) >= 3) THEN
    OPPORTUNITIES."COL_VALUE" END::FLOAT)) * 0.75, 0) END) / (100000)) * (100000))
    > 0 THEN (ROUND((CASE WHEN (Owners."REVENUE_WON") IS NULL AND ((SUM(CASE WHEN
    (OPPORTUNITIES."STATUS" = 'Open') AND (TRY_TO_NUMBER(LEFT(OPPORTUNITIES."PIPELINESTEP",
    1)) >= 3) THEN OPPORTUNITIES."COL_VALUE" END::FLOAT)) * 0.75) IS NULL THEN NULL
    ELSE COALESCE(Owners."REVENUE_WON", 0) + COALESCE((SUM(CASE WHEN (OPPORTUNITIES."STATUS"
    = 'Open') AND (TRY_TO_NUMBER(LEFT(OPPORTUNITIES."PIPELINESTEP", 1)) >= 3) THEN
    OPPORTUNITIES."COL_VALUE" END::FLOAT)) * 0.75, 0) END) / (100000)) * (100000))
    ELSE ROUND((CASE WHEN (Owners."REVENUE_WON") IS NULL AND ((SUM(CASE WHEN (OPPORTUNITIES."STATUS"
    = 'Open') AND (TRY_TO_NUMBER(LEFT(OPPORTUNITIES."PIPELINESTEP", 1)) >= 3) THEN
    OPPORTUNITIES."COL_VALUE" END::FLOAT)) * 0.75) IS NULL THEN NULL ELSE COALESCE(Owners."REVENUE_WON",
    0) + COALESCE((SUM(CASE WHEN (OPPORTUNITIES."STATUS" = 'Open') AND (TRY_TO_NUMBER(LEFT(OPPORTUNITIES."PIPELINESTEP",
    1)) >= 3) THEN OPPORTUNITIES."COL_VALUE" END::FLOAT)) * 0.75, 0) END) / (10000))
    * (10000) END
  dax_expression: "\nVAR RevenueInPipeline =\n    CALCULATE (\n        SUMX ( Opportunities,\
    \ Opportunities[Value] ),\n        FILTER (\n            Opportunities,\n    \
    \        Opportunities[Status] = \"Open\"\n            && VALUE(LEFT(Opportunities[PipelineStep],1))\
    \ >=3\n        )\n    )\nVAR BaseGoal =  \nMROUND(([Revenue Won]+ (RevenueInPipeline*.75)),100000)\
    \    \nRETURN\nIF(BaseGoal > 0, BaseGoal, MROUND(([Revenue Won]+ (RevenueInPipeline*.75)),10000))"
  format_string: \$#,0.###############;(\$#,0.###############);\$#,0.###############
