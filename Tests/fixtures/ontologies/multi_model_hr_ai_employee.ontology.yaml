metrics:
- name: Employees
  logical_name: EMPLOYEES
  label: Employees
  description: Total headcount for the period in scope.
  sql_expression: COUNT(Employee."EMPLID")
  dax_expression: CALCULATE(COUNT([EmplID]), FILTER(ALL('Date'[Period number]), 'Date'[Period
    number] = MAX('Date'[Period number])))
  format_string: '#,0'
  is_hidden: false
  aggregation_type: NONE
  grain: []
  synonyms:
  - emp count
  - EmpCount
  - Employees
  business_rules: []
  domain: Multi-Model-HR-AI-Employee
  concept: Employee
  tags: []
  origin: bi
  bi_description: Total headcount for the period in scope.
- name: Separations
  logical_name: SEPARATIONS
  label: Separations
  description: Number of employees who left the company in the period.
  sql_expression: COUNT(CASE WHEN (Employee."TERMDATE" IS NOT NULL) THEN Employee."EMPLID"
    END)
  dax_expression: CALCULATE(COUNT([EmplID]), FILTER(Employee, NOT(ISBLANK(Employee[TermDate]))))
  format_string: '#,0'
  is_hidden: false
  aggregation_type: NONE
  grain: []
  synonyms:
  - separations
  business_rules: []
  domain: Multi-Model-HR-AI-Employee
  concept: Employee
  tags: []
  origin: bi
  bi_description: Number of employees who left the company in the period.
- name: Actives
  logical_name: ACTIVES
  label: Actives
  description: Total count of EmpCount for Actives (from Human Resources Sample PBIX).
  dax_expression: CALCULATE([Employees], FILTER(Employee, ISBLANK(Employee[TermDate])))
  format_string: '#,0'
  is_hidden: false
  aggregation_type: NONE
  grain: []
  synonyms:
  - actives
  business_rules: []
  domain: Multi-Model-HR-AI-Employee
  concept: Employee
  tags: []
  origin: bi
  bi_description: Number of employees still working at the end of the period.
- name: New Hires
  logical_name: NEW_HIRES
  label: New Hires
  description: Number of employees hired in the period.
  sql_expression: SUM(Employee."ISNEWHIRE"::FLOAT)
  dax_expression: SUM([isNewHire])
  format_string: '#,0'
  is_hidden: false
  aggregation_type: NONE
  grain: []
  synonyms:
  - new hires
  - hires
  business_rules: []
  domain: Multi-Model-HR-AI-Employee
  concept: Employee
  tags: []
  origin: bi
  bi_description: Number of employees hired in the period.
- name: AVG Tenure Days
  logical_name: AVG_TENURE_DAYS
  label: AVG Tenure Days
  description: Average employee tenure, in days.
  sql_expression: AVG(Employee."TENUREDAYS"::FLOAT)
  dax_expression: AVERAGE([TenureDays])
  format_string: '#,0'
  is_hidden: false
  aggregation_type: NONE
  grain: []
  synonyms:
  - AVG tenure days
  - tenure days
  business_rules: []
  domain: Multi-Model-HR-AI-Employee
  concept: Employee
  tags: []
  origin: bi
  bi_description: Average employee tenure, in days.
- name: AVG Tenure Months
  logical_name: AVG_TENURE_MONTHS
  label: AVG Tenure Months
  description: Average employee tenure, in months.
  sql_expression: CASE WHEN (ROUND(Employee."AVG_TENURE_DAYS" / 30, 1)) IS NULL AND
    (1) IS NULL THEN NULL ELSE COALESCE(ROUND(Employee."AVG_TENURE_DAYS" / 30, 1),
    0) - 1 END
  dax_expression: ROUND([AVG Tenure Days]/30, 1)-1
  format_string: '0'
  is_hidden: false
  aggregation_type: NONE
  grain: []
  synonyms:
