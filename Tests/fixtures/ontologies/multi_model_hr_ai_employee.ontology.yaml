- name: Seps YoY Var
  logical_name: SEPS_YOY_VAR
  label: Seps YoY Var
  description: Calculated metric for Seps Yo Y Var (from Human Resources Sample PBIX).
  sql_expression: CASE WHEN (Employee."SEPARATIONS") IS NULL AND (Employee."SEPS_SPLY")
    IS NULL THEN NULL ELSE COALESCE(Employee."SEPARATIONS", 0) - COALESCE(Employee."SEPS_SPLY",
    0) END
  dax_expression: '[Separations]-[Seps SPLY]'
  format_string: '#,0'
  is_hidden: false
  aggregation_type: NONE
  grain: []
  synonyms:
  - seps YoY var
  business_rules: []
  derives_from:
  - Separations
  domain: Multi-Model-HR-AI-Employee
  concept: Employee
  tags: []
  origin: bi
  bi_description: Change in separations vs. the same period last year (positive =
    more people leaving).
- name: Actives YoY Var
  logical_name: ACTIVES_YOY_VAR
  label: Actives YoY Var
  description: Change in active headcount vs. the same period last year (positive
    = workforce grew).
  sql_expression: CASE WHEN (Employee."ACTIVES") IS NULL AND (Employee."ACTIVES_SPLY")
    IS NULL THEN NULL ELSE COALESCE(Employee."ACTIVES", 0) - COALESCE(Employee."ACTIVES_SPLY",
    0) END
  dax_expression: '[Actives]-[Actives SPLY]'
  format_string: '#,0'
  is_hidden: false
  aggregation_type: NONE
  grain: []
  synonyms:
  - actives YoY var
  business_rules: []
  derives_from:
  - Actives
  domain: Multi-Model-HR-AI-Employee
  concept: Employee
  tags: []
  origin: bi
  bi_description: Change in active headcount vs. the same period last year (positive
    = workforce grew).
- name: New Hires YoY Var
  logical_name: NEW_HIRES_YOY_VAR
  label: New Hires YoY Var
  description: Change in new hires vs. the same period last year (positive = more
    hiring).
  sql_expression: CASE WHEN (Employee."NEW_HIRES") IS NULL AND (Employee."NEW_HIRES_SPLY")
    IS NULL THEN NULL ELSE COALESCE(Employee."NEW_HIRES", 0) - COALESCE(Employee."NEW_HIRES_SPLY",
    0) END
  dax_expression: '[New Hires]-[New Hires SPLY]'
  format_string: '#,0'
  is_hidden: false
