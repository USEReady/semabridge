- name: Seps YoY % Change
  logical_name: SEPS_YOY_PCT_CHANGE
  label: Seps YoY % Change
  description: Percent change in separations vs. the same period last year - shows
    whether attrition is trending up or down.
  sql_expression: Employee."SEPS_YOY_VAR" / NULLIF(Employee."SEPS_SPLY", 0)
  dax_expression: DIVIDE([Seps YoY Var], [Seps SPLY])
  format_string: '#,0.0%;-#,0.0%;#,0.0%'
  is_hidden: false
  aggregation_type: NONE
  grain: []
  synonyms:
  - seps YoY % change
  business_rules: []
  domain: Multi-Model-HR-AI-Employee
  concept: Employee
  tags: []
  origin: bi
  bi_description: Percent change in separations vs. the same period last year - shows
    whether attrition is trending up or down.
- name: Actives YoY % Change
  logical_name: ACTIVES_YOY_PCT_CHANGE
  label: Actives YoY % Change
  description: Percent change in active headcount vs. the same period last year -
    shows workforce growth or shrinkage.
  sql_expression: Employee."ACTIVES_YOY_VAR" / NULLIF(Employee."ACTIVES_SPLY", 0)
  dax_expression: DIVIDE([Actives YoY Var], [Actives SPLY])
  format_string: '#,0.0%;-#,0.0%;#,0.0%'
