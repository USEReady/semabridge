  logical_name: CASES_PCT_BY_SUBJECT
  label: Cases % by Subject
  sql_expression: CASES."CASE_COUNT" / NULLIF(SUM(CASES."CASE_COUNT"::FLOAT) OVER
    (PARTITION BY EXCLUDING CASES."SUBJECT"), 0)
  dax_expression: "\nDIVIDE(\n        [CASE_COUNT],\n        CALCULATE(\n        \
