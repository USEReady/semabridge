- name: CSAT_IMPACT
  logical_name: CSAT_IMPACT
  label: CSAT Impact
  sql_expression: CASE WHEN (1) IS NULL AND ((((SUM(CASES."CSAT_SUM"::FLOAT) OVER
    (PARTITION BY EXCLUDING CASES."TOPIC") - CASES."CSAT_SUM") / NULLIF(SUM(CASES."CSAT_CNT"::FLOAT)
    OVER (PARTITION BY EXCLUDING CASES."TOPIC") - CASES."CSAT_CNT", 0))) / NULLIF((SUM(CASES."CSAT_SUM"::FLOAT)
    OVER (PARTITION BY EXCLUDING CASES."TOPIC") / NULLIF(SUM(CASES."CSAT_CNT"::FLOAT)
    OVER (PARTITION BY EXCLUDING CASES."TOPIC"), 0)), 0)) IS NULL THEN NULL ELSE 1
    - COALESCE((((SUM(CASES."CSAT_SUM"::FLOAT) OVER (PARTITION BY EXCLUDING CASES."TOPIC")
    - CASES."CSAT_SUM") / NULLIF(SUM(CASES."CSAT_CNT"::FLOAT) OVER (PARTITION BY EXCLUDING
    CASES."TOPIC") - CASES."CSAT_CNT", 0))) / NULLIF((SUM(CASES."CSAT_SUM"::FLOAT)
    OVER (PARTITION BY EXCLUDING CASES."TOPIC") / NULLIF(SUM(CASES."CSAT_CNT"::FLOAT)
    OVER (PARTITION BY EXCLUDING CASES."TOPIC"), 0)), 0), 0) END
  dax_expression: "\nVAR FactorAvg =\n    AVERAGE ( 'Cases'[CSAT] )\nVAR AllAvg =\n\
    \    CALCULATE ( AVERAGE ( 'Cases'[CSAT] ), ALL ( 'Cases' ) )\nVAR AllAvgExcept\
    \ =\n    CALCULATE (\n        AVERAGE ( 'Cases'[CSAT] ),\n        FILTER ( ALL\
    \ ( 'Cases' ), 'Cases'[Topic] <> SELECTEDVALUE ( 'Cases'[Topic] ) )\n    )\nRETURN\n\
    \    1 - ( AllAvgExcept / AllAvg )"
  format_string: 0.00%;-0.00%;0.00%
  is_hidden: false
  aggregation_type: NONE
  grain: []
  synonyms:
  - CSAT Impact
  - CSAT_IMPACT
  business_rules: []
  domain: Artificial Intelligence Sample
  concept: Cases
  semantic_view_name: SEMABRIDGE.ARTIFICIAL_INTELLIGENCE.ARTIFICIAL_INTELLIGENCE_SAMPLE_SEMANTIC
  tags: []
  origin: bi
