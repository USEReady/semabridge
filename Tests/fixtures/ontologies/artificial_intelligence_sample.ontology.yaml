  logical_name: CSAT_IMPACT_SUBJECT
  label: CSAT Impact - Subject
  sql_expression: CASE WHEN (1) IS NULL AND ((((SUM(CASES."CSAT_SUM"::FLOAT) OVER
    (PARTITION BY EXCLUDING CASES."SUBJECT") - CASES."CSAT_SUM") / NULLIF(SUM(CASES."CSAT_CNT"::FLOAT)
    OVER (PARTITION BY EXCLUDING CASES."SUBJECT") - CASES."CSAT_CNT", 0))) / NULLIF((SUM(CASES."CSAT_SUM"::FLOAT)
    OVER (PARTITION BY EXCLUDING CASES."SUBJECT") / NULLIF(SUM(CASES."CSAT_CNT"::FLOAT)
    OVER (PARTITION BY EXCLUDING CASES."SUBJECT"), 0)), 0)) IS NULL THEN NULL ELSE
    1 - COALESCE((((SUM(CASES."CSAT_SUM"::FLOAT) OVER (PARTITION BY EXCLUDING CASES."SUBJECT")
