metrics:
- name: CASE_COUNT
  logical_name: CASE_COUNT
  label: Case Count
  sql_expression: COUNT(*)
  dax_expression: "\n    COUNTROWS('Cases')"
  format_string: '#,0'
  is_hidden: false
  aggregation_type: NONE
  grain: []
  synonyms:
  - Case Count
  - CASE_COUNT
  business_rules: []
  domain: Artificial Intelligence Sample
  concept: Cases
  semantic_view_name: SEMABRIDGE.ARTIFICIAL_INTELLIGENCE.ARTIFICIAL_INTELLIGENCE_SAMPLE_SEMANTIC
  tags: []
  origin: bi
- name: ESCALATIONS
  logical_name: ESCALATIONS
  label: Escalations
  sql_expression: IFF(COALESCE((COUNT(*)), 0) = 0, 0, COUNT(CASE WHEN CASES."IS_ESCALATED"
    = TRUE THEN 1 END) / (COUNT(*)))
  dax_expression: DIVIDE(CALCULATE(COUNTROWS('Cases'),'Cases'[Is Escalated] = TRUE())
    , [CASE_COUNT],0)
  format_string: '#,0%;-#,0%;#,0%'
  is_hidden: false
  aggregation_type: NONE
  grain: []
  synonyms:
  - Escalations
  business_rules: []
  domain: Artificial Intelligence Sample
  concept: Cases
  semantic_view_name: SEMABRIDGE.ARTIFICIAL_INTELLIGENCE.ARTIFICIAL_INTELLIGENCE_SAMPLE_SEMANTIC
  tags: []
  origin: bi
- name: SLA_COMPLIANCE
  logical_name: SLA_COMPLIANCE
  label: SLA Compliance
  sql_expression: IFF(COALESCE((COUNT(*)), 0) = 0, 0, COUNT(CASE WHEN COALESCE(CASES."IS_SLA_VIOLATION",
    FALSE) = FALSE THEN 1 END) / (COUNT(*)))
  dax_expression: DIVIDE(CALCULATE(COUNTROWS('Cases'),'Cases'[Is SLA Violation] =
    FALSE()) , [CASE_COUNT],0)
  format_string: '#,0%;-#,0%;#,0%'
  is_hidden: false
  aggregation_type: NONE
  grain: []
  synonyms:
  - SLA Compliance
  - SLA_COMPLIANCE
  business_rules: []
  domain: Artificial Intelligence Sample
  concept: Cases
  semantic_view_name: SEMABRIDGE.ARTIFICIAL_INTELLIGENCE.ARTIFICIAL_INTELLIGENCE_SAMPLE_SEMANTIC
  tags: []
  origin: bi
- name: CASES_MOMPCT
  logical_name: CASES_MOMPCT
  label: Cases MoM%
  sql_expression: ((COUNT(*)) - (COUNT(CASE WHEN CASES."IS_SPLY_MONTH" THEN 1 END)))
    / NULLIF((COUNT(CASE WHEN CASES."IS_SPLY_MONTH" THEN 1 END)), 0)
  dax_expression: "\nVAR __PREV_MONTH = CALCULATE([CASE_COUNT], DATEADD('Case Calendar'[Date],\
    \ -1, MONTH))\nRETURN\n\tDIVIDE([CASE_COUNT] - __PREV_MONTH, __PREV_MONTH)"
  format_string: 0.0%;-0.0%;0.0%
  is_hidden: false
  aggregation_type: NONE
  grain: []
  synonyms:
  - Cases MoM%
  - CASES_MOMPCT
  business_rules: []
  domain: Artificial Intelligence Sample
  concept: Cases
  semantic_view_name: SEMABRIDGE.ARTIFICIAL_INTELLIGENCE.ARTIFICIAL_INTELLIGENCE_SAMPLE_SEMANTIC
  tags: []
  origin: bi
- name: CASES_PCT_BY_PRODUCT
  logical_name: CASES_PCT_BY_PRODUCT
  label: Cases % by Product
  sql_expression: CASES."CASE_COUNT" / NULLIF(SUM(CASES."CASE_COUNT"::FLOAT) OVER
    (PARTITION BY EXCLUDING PRODUCTS."PRODUCT"), 0)
  dax_expression: "\nDIVIDE(\n        [CASE_COUNT],\n        CALCULATE(\n        \
    \    [CASE_COUNT],All('Products')\n        )\n    )"
  format_string: 0.00%;-0.00%;0.00%
  is_hidden: false
  aggregation_type: NONE
  grain: []
  synonyms:
