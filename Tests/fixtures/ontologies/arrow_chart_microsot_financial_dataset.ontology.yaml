- name: SHOWVALUEFORDATES
  logical_name: SHOWVALUEFORDATES
  label: Showvaluefordates
  dax_expression: "\nVAR __LastDateWithData =\n    CALCULATE (\n        MAXX ( { MAX\
    \ ( 'financials'[Date] ) }, ''[Value] ),\n        REMOVEFILTERS ()\n    )\nVAR\
    \ __FirstDateVisible =\n    MIN ( 'Date'[Date] )\nVAR __Result =\n    __FirstDateVisible\
    \ <= __LastDateWithData\nRETURN\n    __Result"
