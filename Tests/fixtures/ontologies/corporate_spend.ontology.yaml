- name: AMOUNT
  label: Amount
  sql_expression: SUM(CASE WHEN fact."IS_YTD" THEN fact."VALUE"::FLOAT END) * 0.3
  dax_expression: TOTALYTD(SUM([Value]), 'Date'[Date])*.3
  aggregation_type: NONE
