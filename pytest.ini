[pytest]
testpaths = Tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
addopts = -v --tb=short --import-mode=importlib
    --basetemp=.pytest_cache/temp
markers =
    live: needs a real external service (Fabric / login.microsoftonline.com / Snowflake); skipped unless SEMABRIDGE_LIVE_TESTS=1
    slow: wall-clock timing test; skipped unless SEMABRIDGE_SLOW_TESTS=1
filterwarnings =
    ignore::DeprecationWarning
log_cli = true
log_cli_level = INFO
