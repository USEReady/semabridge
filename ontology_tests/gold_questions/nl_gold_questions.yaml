# Gold NL-to-SQL benchmark questions per deployed semantic model.
# Each model defines a minimum accuracy floor (`min_accuracy`) enforced in CI/PR checks.
models:
  - model_id: artificial_intelligence_sample
    ontology_file: Config/ontologies/artificial_intelligence_sample.ontology.yaml
    min_accuracy: 90.0
    cases:
      - id: AI-01
        question: "How many opportunities did we win and lose?"
        expected_metrics: ["Count of Won", "Count of Lost"]
        expected_dimensions: []
        expect_refusal: false
      - id: AI-02
        question: "How many opportunities are open?"
        expected_metrics: ["Opportunity Count In Pipeline"]
        expected_dimensions: []
        expect_refusal: false
      - id: AI-03
        question: "How many opportunities do we have?"
        expected_metrics: ["Opportunity Count"]
        expected_dimensions: []
        expect_refusal: false
      - id: AI-04
        question: "Revenue won by Sales owner"
        expected_metrics: ["Revenue Won"]
        expected_dimensions: ["Sales owner"]
        expect_refusal: false
      - id: AI-05
        question: "Case count by agent"
        expected_metrics: ["Case Count"]
        expected_dimensions: ["Agent"]
        expect_refusal: false
      - id: AI-06
        question: "SLA compliance by severity"
        expected_metrics: ["SLA Compliance"]
        expected_dimensions: ["Severity"]
        expect_refusal: false
      - id: AI-07
        question: "Revenue in pipeline by Territory"
        expected_metrics: ["Revenue In Pipeline"]
        expected_dimensions: ["Territory"]
        expect_refusal: false
      - id: AI-08
        question: "Case count by CaseSeq"
        expected_metrics: ["Case Count"]
        expected_dimensions: []
        expect_refusal: false
        note: "CaseSeq is numeric (INTEGER) and must never group"
      - id: AI-09
        question: "Revenue won by Annual Revenue"
        expected_metrics: ["Revenue Won"]
        expected_dimensions: []
        expect_refusal: false
        note: "Annual Revenue is numeric (INTEGER) and must never group"
      - id: AI-10
        question: "Case count by Subject"
        expected_metrics: ["Case Count"]
        expected_dimensions: ["Subject"]
        expect_refusal: false
      - id: AI-11
        question: "What is the employee churn rate by department?"
        expected_metrics: []
        expected_dimensions: []
        expect_refusal: true

